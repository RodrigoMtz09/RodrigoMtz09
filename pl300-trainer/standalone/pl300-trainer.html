ement.","whyNot":{"b":"A single report page in Power BI Desktop is bound to that report's model(s) and cannot pin visuals from other separate reports the way a dashboard can.","c":"Paginated reports are designed for pixel-perfect, printable operational reporting from a single dataset, not for combining tiles from multiple reports.","d":"An app landing page organizes and distributes existing content but is not the canvas for pinning individual visuals from multiple reports into one view."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/service-dashboards","tags":["dashboard","pin","tiles"]},{"id":"mng-wsp-0008","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure workspace roles","type":"single","difficulty":2,"stem":"A workspace publishes an app to consumers, but a group of analysts also needs to open and read the reports **directly in the workspace** to validate content before the app is updated. The analysts must not be able to edit or publish anything.\n\nWhich workspace role should you assign to the analysts?","options":[{"id":"a","text":"Viewer"},{"id":"b","text":"Contributor"},{"id":"c","text":"Member"},{"id":"d","text":"Admin"}],"correct":["a"],"explanation":{"why":"The Viewer role grants read-only access to content in the workspace: users can view and interact with reports and dashboards but cannot edit, publish, or delete anything. This satisfies validation-in-workspace with no edit rights.","whyNot":{"b":"Contributor can create, edit, and publish content, which exceeds the read-only requirement.","c":"Member can edit and publish content and manage some access, far more than read-only.","d":"Admin has full control including managing access and deleting the workspace, which is excessive for read-only validators."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-roles-new-workspaces","tags":["workspace","roles","viewer"]},{"id":"mng-wsp-0009","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Manage app audiences and access","type":"dropdown","difficulty":2,"stem":"You publish a Power BI app from a workspace. Different departments should see different reports within the same app. You want to avoid maintaining separate apps.\n\nComplete the sentence by selecting the correct option: *To show different content to different groups of consumers within one published app, you configure multiple ______ and assign each report and audience its permitted users.*\n\nSelect the option that correctly completes the sentence.","options":[{"id":"a","text":"app audiences"},{"id":"b","text":"workspaces"},{"id":"c","text":"semantic models"},{"id":"d","text":"gateways"}],"correct":["a"],"explanation":{"why":"Within a single Power BI app you can define multiple audiences, each exposing a tailored subset of the app's content to a specific set of users or security groups. This lets one app serve different departments without maintaining separate apps.","whyNot":{"b":"Creating multiple workspaces means maintaining multiple apps, which is exactly what you were asked to avoid.","c":"Semantic models store and model data; they do not control which reports different consumer groups see in an app.","d":"Gateways provide connectivity to data sources and have nothing to do with tailoring app content per audience."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-create-distribute-apps","tags":["app","audiences","distribution"]},{"id":"mng-wsp-0010","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure scheduled refresh and gateways","type":"single","difficulty":3,"stem":"A semantic model refreshes from an on-premises source through a standard on-premises data gateway. Refresh currently works. The colleague who originally installed the gateway leaves the company, and IT wants to ensure the gateway remains manageable and that scheduled refresh continues without interruption.\n\nWhat should you do to keep the gateway manageable?","options":[{"id":"a","text":"Add at least one additional gateway admin so the gateway is not solely owned by the departing user."},{"id":"b","text":"Switch the semantic model to a personal mode gateway installed on the departing user's laptop."},{"id":"c","text":"Delete the data source and recreate it in the cloud without a gateway."},{"id":"d","text":"Change the semantic model storage mode to Import so a gateway is no longer needed."}],"correct":["a"],"explanation":{"why":"A standard on-premises data gateway can have multiple administrators. Adding another gateway admin removes the single-owner risk so the gateway and its data source mappings stay manageable when the original installer leaves, keeping scheduled refresh working.","whyNot":{"b":"Personal mode gateways are tied to a single user and typically a personal machine; relying on the departing user's laptop would break refresh once they leave.","c":"The data is on-premises, so removing the gateway would break connectivity; refresh cannot reach an on-premises source without a gateway.","d":"Import models refreshing from an on-premises source still require a gateway, so changing storage mode does not remove the gateway dependency."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/connect-data/service-gateway-onprem","tags":["gateway","admin","scheduled-refresh"]},{"id":"mng-wsp-0011","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure workspace roles","type":"dragdrop","difficulty":3,"stem":"You are documenting the minimum workspace role required for each task. In the trainer UI you drag a role onto each capability; here, select the single option that lists the correct **minimum** role for all three capabilities in order.\n\n1. Manage workspace access (add/remove users and change roles)\n2. Publish and edit reports but not manage access\n3. View and interact with content only (read-only)\n\nSelect the option whose role order matches capabilities 1, 2, and 3.","options":[{"id":"a","text":"1: Admin  2: Contributor  3: Viewer"},{"id":"b","text":"1: Member  2: Viewer  3: Contributor"},{"id":"c","text":"1: Contributor  2: Admin  3: Member"},{"id":"d","text":"1: Viewer  2: Member  3: Admin"}],"correct":["a"],"explanation":{"why":"Managing workspace access (add/remove users, change roles) requires Admin (Member can add users only up to its own level, so Admin is the safe minimum for full access management). Publishing and editing without managing access is Contributor. Read-only interaction is Viewer. Option A maps all three correctly.","whyNot":{"b":"Viewer cannot publish or edit, and Contributor is not read-only, so mapping capability 2 to Viewer and capability 3 to Contributor is reversed and incorrect.","c":"Contributor cannot manage workspace access, and Admin is more than the minimum needed for publishing/editing, so this ordering is wrong.","d":"Viewer cannot manage access and Admin is far more than needed for read-only, so every mapping in this option is incorrect."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-roles-new-workspaces","tags":["workspace","roles","mapping"]},{"id":"mng-sec-0012","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Configure row-level security roles","type":"single","difficulty":1,"stem":"Sales representatives should each see only the rows for their own region in a shared report. You plan to implement **row-level security (RLS)**.\n\nWhere do you define the RLS roles and their DAX filter rules?","options":[{"id":"a","text":"In Power BI Desktop, using Manage roles to create roles with table filter DAX expressions, then publish the model."},{"id":"b","text":"In the report's visual-level filters pane in the Power BI service."},{"id":"c","text":"In the workspace settings under Access."},{"id":"d","text":"In the on-premises data gateway configuration."}],"correct":["a"],"explanation":{"why":"Static RLS roles and their DAX table-filter rules are defined in Power BI Desktop using Manage roles. After publishing, you map users or security groups to those roles in the Power BI service. This is the standard place to author RLS.","whyNot":{"b":"Visual-level filters change what a visual displays for everyone; they do not enforce per-user data security and can be bypassed.","c":"Workspace Access assigns roles like Member or Viewer to the workspace; it does not define row-level DAX filters.","d":"The gateway handles data source connectivity, not RLS role definitions."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-rls","tags":["rls","roles","power-bi-desktop"]},{"id":"mng-sec-0013","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Manage RLS role membership","type":"single","difficulty":2,"stem":"You published a semantic model that defines an RLS role named **EU-Sales**. Membership in this role changes frequently as staff join and leave the EU sales team. You want to minimize ongoing administration when assigning users to the role.\n\nWhat should you map to the EU-Sales role in the Power BI service?","options":[{"id":"a","text":"A Microsoft Entra security group that the identity team keeps in sync with EU sales staff."},{"id":"b","text":"Each individual user account, added and removed manually as staff change."},{"id":"c","text":"The workspace Contributor role."},{"id":"d","text":"A distribution list used only for email announcements."}],"correct":["a"],"explanation":{"why":"Mapping a Microsoft Entra security group to the RLS role means membership is managed centrally in the group; as people join or leave EU sales, updating the group automatically adjusts RLS access, minimizing per-model administration.","whyNot":{"b":"Adding individual users to the role means editing the role membership every time staff change, which is exactly the ongoing administration you want to avoid.","c":"Workspace roles control content permissions, not RLS role membership; you cannot secure rows by pointing an RLS role at a workspace role.","d":"A mail distribution list is not a security group and cannot be used to assign RLS role membership for data security."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/guidance/rls-guidance","tags":["rls","security-group","membership"]},{"id":"mng-sec-0014","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Configure and validate RLS","type":"multi","difficulty":2,"stem":"You are implementing static row-level security on a semantic model that is published to a workspace. You need a reliable end-to-end process.\n\nWhich **two** actions are part of correctly implementing and validating RLS? Each correct answer presents part of the solution.","options":[{"id":"a","text":"Define roles with table filter DAX in Power BI Desktop and use **View as** to test them before publishing."},{"id":"b","text":"After publishing, assign users or security groups to the roles under the semantic model's Security settings in the service."},{"id":"c","text":"Grant users the workspace Admin role so RLS applies to them."},{"id":"d","text":"Add each RLS role as a separate workspace."},{"id":"e","text":"Enable RLS only by hiding columns in the report view."}],"correct":["a","b"],"explanation":{"why":"Correct RLS implementation defines roles with DAX filters and tests them with View as in Power BI Desktop, then assigns users or security groups to those roles in the semantic model's Security settings in the service. Together these steps author and enforce RLS.","whyNot":{"c":"Members of the workspace Admin (and Member/Contributor) roles are not restricted by RLS on the model in that workspace; giving users Admin would actually bypass RLS, not apply it.","d":"RLS roles are defined inside the semantic model, not as workspaces; creating workspaces per role does not implement RLS.","e":"Hiding columns in a report is cosmetic and does not restrict rows or enforce security; users can still access underlying data."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-rls","tags":["rls","view-as","security-settings"]},{"id":"mng-sec-0015","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Implement dynamic row-level security","type":"single","difficulty":3,"stem":"A single RLS role must automatically filter each user to only the rows that match their own email, without creating a separate role per user. A **UserSecurity** table maps each user's email to their allowed regions.\n\nWhich DAX filter expression on the UserSecurity table implements this **dynamic** RLS?","options":[{"id":"a","text":"[UserEmail] = USERPRINCIPALNAME()"},{"id":"b","text":"[UserEmail] = \"all\""},{"id":"c","text":"USERNAME() = \"Admin\""},{"id":"d","text":"[Region] = SELECTEDVALUE( 'Slicer'[Region] )"}],"correct":["a"],"explanation":{"why":"Dynamic RLS uses functions such as USERPRINCIPALNAME() (or USERNAME()) to return the current user's identity and compare it to a security table column. Filtering UserSecurity where [UserEmail] = USERPRINCIPALNAME() restricts each user to their own mapped rows within a single role.","whyNot":{"b":"Comparing to a literal \"all\" is static and would either match nothing or the same rows for everyone; it does not adapt to the signed-in user.","c":"Hardcoding USERNAME() = \"Admin\" only ever evaluates for a single named account and does not dynamically filter each user to their own rows.","d":"A slicer selection is a user-changeable report interaction, not a security boundary; it cannot enforce per-user data security and is not a valid RLS rule."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-rls","tags":["rls","dynamic","userprincipalname","dax"]},{"id":"mng-sec-0016","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Manage access to semantic models","type":"multi","difficulty":2,"stem":"Analysts in another workspace need to build their own new reports on top of a certified semantic model you own, but they should **not** be able to edit the model itself.\n\nWhich **two** actions let them create reports against your semantic model with least privilege? Each correct answer presents part of the solution.","options":[{"id":"a","text":"Grant them the **Build** permission on the semantic model."},{"id":"b","text":"Share the semantic model (or let them discover it) so they can connect from Power BI Desktop or the service."},{"id":"c","text":"Add them as Members of the workspace that hosts the semantic model."},{"id":"d","text":"Give them Admin on the workspace that hosts the semantic model."},{"id":"e","text":"Assign them an RLS role that has no filters."}],"correct":["a","b"],"explanation":{"why":"Build permission on a semantic model allows a user to create new content (reports, dashboards, and to connect via Analyze in Excel) on top of the model without editing it. Granting Build and making the model accessible/discoverable to them provides least-privilege report-building.","whyNot":{"c":"Making them workspace Members grants edit and publish rights to the model and other items, which exceeds least privilege and lets them modify the model.","d":"Workspace Admin is even broader, allowing full control including deleting the workspace and managing access, far beyond building reports.","e":"An empty RLS role governs which rows are visible; it neither grants the ability to build reports nor is required for report creation."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-permissions","tags":["semantic-model","build-permission","least-privilege"]},{"id":"mng-sec-0017","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Apply sensitivity labels","type":"single","difficulty":1,"stem":"Your governance team wants Power BI reports and semantic models classified with organizational labels such as **Confidential** so that protection settings (like encryption) can follow the data when it is exported to Excel or PDF.\n\nWhich feature should you apply to the Power BI items?","options":[{"id":"a","text":"Microsoft Purview Information Protection sensitivity labels."},{"id":"b","text":"Endorsement (Promoted/Certified)."},{"id":"c","text":"Row-level security roles."},{"id":"d","text":"Workspace Viewer role."}],"correct":["a"],"explanation":{"why":"Sensitivity labels (from Microsoft Purview Information Protection) classify Power BI content with labels such as Confidential and can carry protection, including encryption, into supported exports like Excel and PDF. This matches the classification-and-protection requirement.","whyNot":{"b":"Endorsement signals trust and quality (Promoted/Certified) but applies no classification or protection that persists on export.","c":"Row-level security limits which rows a user sees within the model; it does not classify items or protect exported files.","d":"The Viewer role controls read access within a workspace and provides no data classification or export protection."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-security-sensitivity-label-overview","tags":["sensitivity-labels","classification","protection"]},{"id":"mng-sec-0018","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Understand object-level security","type":"single","difficulty":3,"stem":"A semantic model contains a **Salary** column and an **Employee Compensation** table that only HR should be able to see. Non-HR users must not even be aware these objects exist; the fields should not appear in the fields list, and referencing them should error for those users.\n\nWhich security capability meets this requirement?","options":[{"id":"a","text":"Object-level security (OLS) that restricts specific tables and columns per role."},{"id":"b","text":"Row-level security (RLS) filtering rows by department."},{"id":"c","text":"Hiding the column in Report view in Power BI Desktop."},{"id":"d","text":"A sensitivity label named HR-Only."}],"correct":["a"],"explanation":{"why":"Object-level security restricts access to specific tables and columns on a per-role basis. Restricted objects are hidden from non-authorized users (they do not appear in the fields list) and any reference to them errors, which is exactly the metadata-level concealment required.","whyNot":{"b":"RLS filters rows, not columns or tables; the Salary column would still be visible in the model even if some rows were filtered.","c":"Hiding a column in Report view is only cosmetic; the object still exists and can be unhidden or queried, so it does not secure the metadata.","d":"A sensitivity label classifies and can protect content but does not remove specific tables or columns from a user's view of the model."}},"sourceUrl":"https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security","tags":["object-level-security","ols","columns"]},{"id":"mng-sec-0019","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Manage item-level access","type":"single","difficulty":2,"stem":"A finance analyst who is **not** a member of your workspace needs to open one specific report and nothing else. You must grant access to just that report with the least privilege and avoid giving workspace access.\n\nWhat should you do?","options":[{"id":"a","text":"Share the individual report with the analyst using per-item sharing."},{"id":"b","text":"Add the analyst as a workspace Member."},{"id":"c","text":"Publish the whole workspace as an app to the entire organization."},{"id":"d","text":"Add the analyst as a workspace Admin."}],"correct":["a"],"explanation":{"why":"Per-item (report) sharing grants access to a single report without adding the user to the workspace, which is the least-privilege way to let the analyst open just that one report.","whyNot":{"b":"Adding the analyst as a workspace Member grants edit/publish rights to all workspace content, far more than access to one report.","c":"Publishing an app to the entire organization exposes content broadly and does not scope access to a single external analyst and one report.","d":"Workspace Admin grants full control over the workspace, which is excessive and violates least privilege for viewing one report."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-share-reports","tags":["item-access","sharing","least-privilege"]},{"id":"mng-sec-0020","domain":"manage","objective":"Secure and govern Power BI items","subObjective":"Distinguish governance features","type":"single","difficulty":1,"stem":"During a governance review, a stakeholder asks which capability ensures that **each viewer of a shared report sees only the data rows relevant to them**, rather than signaling that the content is trusted.\n\nWhich capability provides this per-user data filtering?","options":[{"id":"a","text":"Row-level security (RLS)."},{"id":"b","text":"Certified endorsement."},{"id":"c","text":"A workspace app."},{"id":"d","text":"A scheduled refresh."}],"correct":["a"],"explanation":{"why":"Row-level security restricts the data rows each user can see based on their role membership, providing per-user data filtering within a shared report. This directly answers the requirement.","whyNot":{"b":"Certification is a trust signal indicating content is authoritative; it does not filter data per user.","c":"A workspace app is a distribution mechanism for content; it does not filter which rows individual users see.","d":"Scheduled refresh keeps data current on a schedule and has no role in restricting rows per user."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/guidance/rls-guidance","tags":["rls","governance","per-user"]},{"id":"cs1-0001","caseStudyId":"cs-contoso-retail","domain":"model","objective":"Design and build a data model","subObjective":"Configure table and column properties; relationships","type":"single","difficulty":2,"stem":"The Customer dimension is joined to Sales with a bidirectional cross-filter relationship. Regional managers report that filtering the Date slicer unexpectedly changes the customer count on unrelated visuals, and query performance is poor. What is the most appropriate change to make while preserving the ability to slice Sales by customer attributes?","options":[{"id":"a","text":"Change the Customer-to-Sales relationship cross-filter direction to Single (Customer filters Sales)."},{"id":"b","text":"Delete the Customer table and merge its columns into Sales with Power Query."},{"id":"c","text":"Set the Customer-to-Sales relationship to inactive and reference it with USERELATIONSHIP in every measure."},{"id":"d","text":"Enable Assume referential integrity on the relationship and keep it bidirectional."}],"correct":["a"],"explanation":{"why":"A standard star-schema dimension should filter the fact in a single direction. Setting Customer-to-Sales to single cross-filter removes the ambiguous propagation paths that cause unexpected filtering and the extra query cost, while still letting customer attributes slice Sales.","whyNot":{"b":"Merging a 1.6M-row dimension into the 48M-row fact bloats storage and destroys the star schema without fixing the underlying cross-filter design.","c":"Making it inactive forces USERELATIONSHIP everywhere and breaks default slicing by customer, which is not required here.","d":"Assume referential integrity optimizes the join query but does not change cross-filter direction, so the unexpected bidirectional filtering remains."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand","tags":["relationships","cross-filter","star-schema","performance"]},{"id":"cs1-0002","caseStudyId":"cs-contoso-retail","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Create time-intelligence measures","type":"single","difficulty":3,"stem":"Regional managers need a Year-over-Year Growth % measure comparing SalesAmount to the same period one year earlier. The Date table is marked as a date table and is contiguous. Which measure definition is correct and most robust?","exhibit":"```DAX\n[Total Sales] = SUM ( Sales[SalesAmount] )\n```","options":[{"id":"a","text":"YoY Growth % = DIVIDE ( [Total Sales] - CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) ), CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) ) )"},{"id":"b","text":"YoY Growth % = [Total Sales] - CALCULATE ( [Total Sales], PREVIOUSYEAR ( Sales[OrderDate] ) )"},{"id":"c","text":"YoY Growth % = DIVIDE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )"},{"id":"d","text":"YoY Growth % = CALCULATE ( [Total Sales], DATEADD ( Sales[OrderDate], -1, YEAR ) )"}],"correct":["a"],"explanation":{"why":"SAMEPERIODLASTYEAR must operate on the marked Date table's date column, and the growth ratio requires dividing the delta by the prior-year value using DIVIDE to avoid divide-by-zero. Option a does exactly this.","whyNot":{"b":"Time-intelligence functions should reference the marked Date dimension column, not the fact's OrderDate, and this returns an absolute difference, not a growth percentage.","c":"SAMEPERIODLASTYEAR returns a table and cannot be the denominator of DIVIDE directly; it must be wrapped in CALCULATE, and this is not a growth ratio.","d":"This returns prior-year sales, not a growth percentage, and uses the fact column rather than the Date table."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/sameperiodlastyear-function-dax","tags":["time-intelligence","SAMEPERIODLASTYEAR","DIVIDE","YoY"]},{"id":"cs1-0003","caseStudyId":"cs-contoso-retail","domain":"visualize","objective":"Create reports","subObjective":"Configure visualizations for analysis","type":"single","difficulty":2,"stem":"Managers want a single visual that shows monthly Total Sales as columns and the rolling 12-month total as a line, on the same axis of months. Which visual type should you use?","options":[{"id":"a","text":"Line and clustered column chart, with Total Sales on the column axis and the rolling 12-month measure on the line axis."},{"id":"b","text":"Two separate cards, one for each measure."},{"id":"c","text":"Clustered column chart with both measures in the Values well."},{"id":"d","text":"Ribbon chart with Month on the axis."}],"correct":["a"],"explanation":{"why":"A line and clustered column combo chart is designed to render one measure as columns and another as a line over a shared category axis, exactly matching monthly columns plus a rolling-total line.","whyNot":{"b":"Cards show single aggregated values and cannot display a monthly trend.","c":"A clustered column chart draws both measures as columns, so the rolling total will not appear as a distinguishable line.","d":"A ribbon chart emphasizes rank changes between categories, not a column-plus-line comparison."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-combo-chart","tags":["combo-chart","visuals","trend"]},{"id":"cs1-0004","caseStudyId":"cs-contoso-retail","domain":"visualize","objective":"Create reports","subObjective":"Enhance reports for usability and storytelling","type":"single","difficulty":2,"stem":"Regional managers want to click a Region in a bar chart and have all other visuals on the page filter to that Region, while a separate KPI card should always show company-wide totals regardless of the selection. What is the best configuration?","options":[{"id":"a","text":"Keep default cross-filtering for the page, then use Edit interactions to set the company-wide KPI card's interaction with the bar chart to None."},{"id":"b","text":"Add a page-level filter that locks every visual to All Regions."},{"id":"c","text":"Sync a slicer across pages so the KPI card ignores the Region."},{"id":"d","text":"Set the bar chart's visual interaction to Highlight for all visuals including the KPI card."}],"correct":["a"],"explanation":{"why":"Default cross-filtering already lets the bar chart filter other visuals. Using Edit interactions to set the KPI card's response to the bar chart to None makes that one card ignore the selection while everything else still filters.","whyNot":{"b":"A page-level filter locking All Regions would prevent every visual from responding to the manager's Region click.","c":"Slicer sync controls slicers across pages and does not stop a card from being cross-filtered by a chart on the same page.","d":"Highlight still passes the Region context to the card, so it would not show company-wide totals."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/service-reports-visual-interactions","tags":["visual-interactions","edit-interactions","usability"]},{"id":"cs1-0005","caseStudyId":"cs-contoso-retail","domain":"manage","objective":"Manage workspaces and datasets","subObjective":"Apply and manage row-level security; deploy an app","type":"single","difficulty":3,"stem":"You must implement RLS so each regional manager sees only their own Store[Region], and deliver the report as an app. In Power BI Desktop you create a role. Which DAX filter and deployment approach correctly enforces per-manager Region security?","options":[{"id":"a","text":"Define role filter [Region] = USERPRINCIPALNAME() ... no. Use a Region mapping table filtered by USERPRINCIPALNAME(), or a static role per Region, then in the service assign managers to the role members and distribute via the app."},{"id":"b","text":"Create one role with filter Store[Region] = \"North\" and add every manager to it, then publish."},{"id":"c","text":"Rely on the app viewer audience alone; app audiences enforce RLS automatically without any role definition."},{"id":"d","text":"Apply object-level security (OLS) on the Region column so managers cannot see other regions."}],"correct":["a"],"explanation":{"why":"Dynamic RLS uses USERPRINCIPALNAME() against a security/mapping table (or a role per Region with the right members) so the filter resolves to the signed-in manager's Region; role membership is assigned in the service, and the report is distributed through the app. This is the maintainable, correct pattern.","whyNot":{"b":"A single hardcoded North role shows every assigned manager only North data, which is wrong for South, East, and West managers.","c":"App audiences control who can open the app; they do not define or enforce row filters, so RLS roles are still required.","d":"OLS hides a column or table for everyone in a role; it does not filter rows to a manager's specific Region."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-rls","tags":["RLS","USERPRINCIPALNAME","app","deployment"]}],"caseStudies":[{"id":"cs-contoso-retail","title":"Contoso Retail sales model","scenario":"Contoso Retail operates 240 stores across four regions (North, South, East, West). The analytics team imports data into a Power BI Desktop model with these tables:\n\n| Table | Type | Rows | Notes |\n|---|---|---|---|\n| Sales | Fact | ~48M | grain = one row per order line; has `OrderDate`, `StoreKey`, `ProductKey`, `CustomerKey`, `SalesAmount`, `Quantity` |\n| Date | Dimension | 3,653 | marked as a date table; contiguous 2016-2025 |\n| Product | Dimension | 22,000 | `ProductKey`, `Category`, `Subcategory` |\n| Store | Dimension | 240 | `StoreKey`, `StoreName`, `Region` |\n| Customer | Dimension | 1.6M | `CustomerKey`, `City`, `Region` |\n\nAll dimensions relate to Sales via single-direction one-to-many relationships on their key columns, except `Customer` which was accidentally loaded with a bidirectional relationship. `Date[Date]` links to `Sales[OrderDate]`.\n\nBusiness asks:\n- Regional managers need year-over-year (YoY) sales growth and a rolling 12-month total.\n- Row-level security (RLS) so each regional manager sees only their own `Store[Region]`.\n- The report must be delivered as a published **app** with managers in a viewer audience.\n- Report pages currently load slowly; a `SalesAmount` measure recalculates a full-table SUMX over a calculated column.\n\nThe team wants guidance on modeling, DAX, visuals, and deployment before go-live.","questions":[{"id":"cs1-0001","caseStudyId":"cs-contoso-retail","domain":"model","objective":"Design and build a data model","subObjective":"Configure table and column properties; relationships","type":"single","difficulty":2,"stem":"The Customer dimension is joined to Sales with a bidirectional cross-filter relationship. Regional managers report that filtering the Date slicer unexpectedly changes the customer count on unrelated visuals, and query performance is poor. What is the most appropriate change to make while preserving the ability to slice Sales by customer attributes?","options":[{"id":"a","text":"Change the Customer-to-Sales relationship cross-filter direction to Single (Customer filters Sales)."},{"id":"b","text":"Delete the Customer table and merge its columns into Sales with Power Query."},{"id":"c","text":"Set the Customer-to-Sales relationship to inactive and reference it with USERELATIONSHIP in every measure."},{"id":"d","text":"Enable Assume referential integrity on the relationship and keep it bidirectional."}],"correct":["a"],"explanation":{"why":"A standard star-schema dimension should filter the fact in a single direction. Setting Customer-to-Sales to single cross-filter removes the ambiguous propagation paths that cause unexpected filtering and the extra query cost, while still letting customer attributes slice Sales.","whyNot":{"b":"Merging a 1.6M-row dimension into the 48M-row fact bloats storage and destroys the star schema without fixing the underlying cross-filter design.","c":"Making it inactive forces USERELATIONSHIP everywhere and breaks default slicing by customer, which is not required here.","d":"Assume referential integrity optimizes the join query but does not change cross-filter direction, so the unexpected bidirectional filtering remains."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand","tags":["relationships","cross-filter","star-schema","performance"]},{"id":"cs1-0002","caseStudyId":"cs-contoso-retail","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Create time-intelligence measures","type":"single","difficulty":3,"stem":"Regional managers need a Year-over-Year Growth % measure comparing SalesAmount to the same period one year earlier. The Date table is marked as a date table and is contiguous. Which measure definition is correct and most robust?","exhibit":"```DAX\n[Total Sales] = SUM ( Sales[SalesAmount] )\n```","options":[{"id":"a","text":"YoY Growth % = DIVIDE ( [Total Sales] - CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) ), CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) ) )"},{"id":"b","text":"YoY Growth % = [Total Sales] - CALCULATE ( [Total Sales], PREVIOUSYEAR ( Sales[OrderDate] ) )"},{"id":"c","text":"YoY Growth % = DIVIDE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )"},{"id":"d","text":"YoY Growth % = CALCULATE ( [Total Sales], DATEADD ( Sales[OrderDate], -1, YEAR ) )"}],"correct":["a"],"explanation":{"why":"SAMEPERIODLASTYEAR must operate on the marked Date table's date column, and the growth ratio requires dividing the delta by the prior-year value using DIVIDE to avoid divide-by-zero. Option a does exactly this.","whyNot":{"b":"Time-intelligence functions should reference the marked Date dimension column, not the fact's OrderDate, and this returns an absolute difference, not a growth percentage.","c":"SAMEPERIODLASTYEAR returns a table and cannot be the denominator of DIVIDE directly; it must be wrapped in CALCULATE, and this is not a growth ratio.","d":"This returns prior-year sales, not a growth percentage, and uses the fact column rather than the Date table."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/sameperiodlastyear-function-dax","tags":["time-intelligence","SAMEPERIODLASTYEAR","DIVIDE","YoY"]},{"id":"cs1-0003","caseStudyId":"cs-contoso-retail","domain":"visualize","objective":"Create reports","subObjective":"Configure visualizations for analysis","type":"single","difficulty":2,"stem":"Managers want a single visual that shows monthly Total Sales as columns and the rolling 12-month total as a line, on the same axis of months. Which visual type should you use?","options":[{"id":"a","text":"Line and clustered column chart, with Total Sales on the column axis and the rolling 12-month measure on the line axis."},{"id":"b","text":"Two separate cards, one for each measure."},{"id":"c","text":"Clustered column chart with both measures in the Values well."},{"id":"d","text":"Ribbon chart with Month on the axis."}],"correct":["a"],"explanation":{"why":"A line and clustered column combo chart is designed to render one measure as columns and another as a line over a shared category axis, exactly matching monthly columns plus a rolling-total line.","whyNot":{"b":"Cards show single aggregated values and cannot display a monthly trend.","c":"A clustered column chart draws both measures as columns, so the rolling total will not appear as a distinguishable line.","d":"A ribbon chart emphasizes rank changes between categories, not a column-plus-line comparison."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-combo-chart","tags":["combo-chart","visuals","trend"]},{"id":"cs1-0004","caseStudyId":"cs-contoso-retail","domain":"visualize","objective":"Create reports","subObjective":"Enhance reports for usability and storytelling","type":"single","difficulty":2,"stem":"Regional managers want to click a Region in a bar chart and have all other visuals on the page filter to that Region, while a separate KPI card should always show company-wide totals regardless of the selection. What is the best configuration?","options":[{"id":"a","text":"Keep default cross-filtering for the page, then use Edit interactions to set the company-wide KPI card's interaction with the bar chart to None."},{"id":"b","text":"Add a page-level filter that locks every visual to All Regions."},{"id":"c","text":"Sync a slicer across pages so the KPI card ignores the Region."},{"id":"d","text":"Set the bar chart's visual interaction to Highlight for all visuals including the KPI card."}],"correct":["a"],"explanation":{"why":"Default cross-filtering already lets the bar chart filter other visuals. Using Edit interactions to set the KPI card's response to the bar chart to None makes that one card ignore the selection while everything else still filters.","whyNot":{"b":"A page-level filter locking All Regions would prevent every visual from responding to the manager's Region click.","c":"Slicer sync controls slicers across pages and does not stop a card from being cross-filtered by a chart on the same page.","d":"Highlight still passes the Region context to the card, so it would not show company-wide totals."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/service-reports-visual-interactions","tags":["visual-interactions","edit-interactions","usability"]},{"id":"cs1-0005","caseStudyId":"cs-contoso-retail","domain":"manage","objective":"Manage workspaces and datasets","subObjective":"Apply and manage row-level security; deploy an app","type":"single","difficulty":3,"stem":"You must implement RLS so each regional manager sees only their own Store[Region], and deliver the report as an app. In Power BI Desktop you create a role. Which DAX filter and deployment approach correctly enforces per-manager Region security?","options":[{"id":"a","text":"Define role filter [Region] = USERPRINCIPALNAME() ... no. Use a Region mapping table filtered by USERPRINCIPALNAME(), or a static role per Region, then in the service assign managers to the role members and distribute via the app."},{"id":"b","text":"Create one role with filter Store[Region] = \"North\" and add every manager to it, then publish."},{"id":"c","text":"Rely on the app viewer audience alone; app audiences enforce RLS automatically without any role definition."},{"id":"d","text":"Apply object-level security (OLS) on the Region column so managers cannot see other regions."}],"correct":["a"],"explanation":{"why":"Dynamic RLS uses USERPRINCIPALNAME() against a security/mapping table (or a role per Region with the right members) so the filter resolves to the signed-in manager's Region; role membership is assigned in the service, and the report is distributed through the app. This is the maintainable, correct pattern.","whyNot":{"b":"A single hardcoded North role shows every assigned manager only North data, which is wrong for South, East, and West managers.","c":"App audiences control who can open the app; they do not define or enforce row filters, so RLS roles are still required.","d":"OLS hides a column or table for everyone in a role; it does not filter rows to a manager's specific Region."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-rls","tags":["RLS","USERPRINCIPALNAME","app","deployment"]}]}],"drills":{"version":"2026.04.20","flashcards":[{"id":"fc-0001","group":"CALCULATE","front":"CALCULATE","back":"Evaluates an expression in a modified filter context. Filter arguments replace (overwrite) existing filters on the same column unless combined with KEEPFILTERS. It is the only function that performs context transition, turning the current row context into an equivalent filter context.\n```DAX\nRed Sales = CALCULATE ( [Total Sales], Product[Color] = \"Red\" )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"fc-0002","group":"CALCULATE","front":"CALCULATETABLE","back":"Like CALCULATE but returns a table instead of a scalar. Use it to apply filter modifiers to a table expression, e.g. as the source of an iterator or a variable.\n```DAX\nHighValue = CALCULATETABLE ( Sales, Sales[Amount] > 1000 )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculatetable-function-dax"},{"id":"fc-0003","group":"CALCULATE","front":"Filter argument as Boolean vs table","back":"A Boolean filter like `Product[Color]=\"Red\"` is syntax sugar CALCULATE rewrites into `FILTER ( ALL ( Product[Color] ), Product[Color]=\"Red\" )`, so it overwrites that column's filter. A table filter gives you full control over which columns are affected.\n```DAX\nCALCULATE ( [Sales], FILTER ( ALL ( Product[Color] ), Product[Color] = \"Red\" ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"fc-0004","group":"CALCULATE","front":"CALCULATE filter evaluation order","back":"Filter arguments are evaluated in the OUTER filter context (before the context modification), then applied together with the new context to evaluate the expression. This is why a filter argument can reference the pre-existing context.\n```DAX\nCALCULATE ( [Sales], 'Date'[Year] = MAX ( 'Date'[Year] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"fc-0005","group":"CALCULATE","front":"KEEPFILTERS with CALCULATE","back":"KEEPFILTERS stops a filter argument from overwriting the same column's existing filter; instead the new filter is intersected (AND) with the current one.\n```DAX\nCALCULATE ( [Sales], KEEPFILTERS ( Product[Color] = \"Red\" ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/keepfilters-function-dax"},{"id":"fc-0006","group":"filter modifiers","front":"ALL","back":"Removes filters from a table or one or more columns, returning all distinct values ignoring context. Used to compute denominators like % of total.\n```DAX\nAll Sales = CALCULATE ( [Total Sales], ALL ( Product ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/all-function-dax"},{"id":"fc-0007","group":"filter modifiers","front":"ALLEXCEPT","back":"Removes all filters from a table EXCEPT those on the specified columns. Handy for keeping a grouping column while clearing everything else.\n```DAX\nCALCULATE ( [Sales], ALLEXCEPT ( Product, Product[Category] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/allexcept-function-dax"},{"id":"fc-0008","group":"filter modifiers","front":"ALLSELECTED","back":"Returns values as filtered by the query's outer context (e.g. slicers) while ignoring filters from inside the current visual's row/column. Great for visual-level % of total that respects slicers.\n```DAX\nCALCULATE ( [Sales], ALLSELECTED ( Product[Category] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/allselected-function-dax"},{"id":"fc-0009","group":"filter modifiers","front":"REMOVEFILTERS","back":"The explicit, readable modifier that clears filters from tables or columns. Functionally the CALCULATE-modifier form of ALL, but can only be used as a filter modifier.\n```DAX\nCALCULATE ( [Sales], REMOVEFILTERS ( 'Date' ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/removefilters-function-dax"},{"id":"fc-0010","group":"filter modifiers","front":"ALLCROSSFILTERED vs ALLNOBLANKROW","back":"ALLNOBLANKROW removes filters but excludes the blank row added for invalid relationships; ALLCROSSFILTERED clears filters that reached a table through cross-filtering as well.\n```DAX\nCALCULATE ( [Sales], ALLNOBLANKROW ( 'Date' ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/allnoblankrow-function-dax"},{"id":"fc-0011","group":"time intelligence","front":"TOTALYTD","back":"Returns a year-to-date running total of an expression over a date column. Requires a contiguous date table. Optional year-end date argument for fiscal years.\n```DAX\nSales YTD = TOTALYTD ( [Total Sales], 'Date'[Date] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/totalytd-function-dax"},{"id":"fc-0012","group":"time intelligence","front":"DATESYTD","back":"Returns a table of dates from the start of the year to the last date in context. Used inside CALCULATE for custom YTD logic.\n```DAX\nCALCULATE ( [Total Sales], DATESYTD ( 'Date'[Date] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/datesytd-function-dax"},{"id":"fc-0013","group":"time intelligence","front":"DATEADD","back":"Shifts the dates in the current context by an interval (DAY, MONTH, QUARTER, YEAR). More flexible than PREVIOUSYEAR because it works at any granularity.\n```DAX\nPY Sales = CALCULATE ( [Total Sales], DATEADD ( 'Date'[Date], -1, YEAR ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/dateadd-function-dax"},{"id":"fc-0014","group":"time intelligence","front":"SAMEPERIODLASTYEAR","back":"Returns the set of dates shifted back exactly one year. Equivalent to DATEADD(dates, -1, YEAR). Must reference the marked date table's date column.\n```DAX\nPY = CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/sameperiodlastyear-function-dax"},{"id":"fc-0015","group":"time intelligence","front":"DATESINPERIOD (rolling 12 months)","back":"Returns dates within an interval starting from a reference date. Ideal for a rolling 12-month total ending at the last date in context.\n```DAX\nRolling 12M = CALCULATE ( [Total Sales], DATESINPERIOD ( 'Date'[Date], MAX ( 'Date'[Date] ), -12, MONTH ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/datesinperiod-function-dax"},{"id":"fc-0016","group":"iterators","front":"SUMX","back":"Iterates a table, evaluating an expression per row in row context, then sums the results. Use when the per-row calculation cannot be pre-aggregated (e.g. price * quantity).\n```DAX\nRevenue = SUMX ( Sales, Sales[Qty] * Sales[Price] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/sumx-function-dax"},{"id":"fc-0017","group":"iterators","front":"AVERAGEX","back":"Iterates a table and averages an expression evaluated in row context. Respects the table granularity you pass, which changes the average.\n```DAX\nAvg Order Value = AVERAGEX ( Sales, Sales[Qty] * Sales[Price] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/averagex-function-dax"},{"id":"fc-0018","group":"iterators","front":"RANKX","back":"Evaluates an expression for each row of a table and returns its rank. The table is usually ALL/ALLSELECTED of the column being ranked to get the full comparison set.\n```DAX\nProduct Rank = RANKX ( ALL ( Product[Name] ), [Total Sales] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/rankx-function-dax"},{"id":"fc-0019","group":"iterators","front":"MAXX / MINX","back":"Iterate a table and return the max/min of an expression across rows. Useful to find the best-selling period or largest single order.\n```DAX\nBest Month = MAXX ( VALUES ( 'Date'[Month] ), [Total Sales] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/maxx-function-dax"},{"id":"fc-0020","group":"iterators","front":"Iterators create row context","back":"Every X-function establishes a row context over its table argument. To reference a measure or aggregate the whole related fact per row, wrap it in CALCULATE to trigger context transition.\n```DAX\nSUMX ( Customer, CALCULATE ( [Total Sales] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/sumx-function-dax"},{"id":"fc-0021","group":"semi-additive","front":"Semi-additive measures","back":"Measures that sum across some dimensions but not over time (e.g. inventory, account balances). You take the value at a point in time rather than summing days.\n```DAX\nClosing Stock = CALCULATE ( SUM ( Inventory[Units] ), LASTDATE ( 'Date'[Date] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/lastdate-function-dax"},{"id":"fc-0022","group":"semi-additive","front":"LASTNONBLANK","back":"Returns the last date (per context) for which an expression is not blank. Essential for balances where not every day has a row.\n```DAX\nBalance = CALCULATE ( SUM ( Ledger[Amount] ), LASTNONBLANK ( 'Date'[Date], CALCULATE ( COUNTROWS ( Ledger ) ) ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/lastnonblank-function-dax"},{"id":"fc-0023","group":"semi-additive","front":"OPENINGBALANCEMONTH","back":"Returns the value of an expression evaluated at the last date before the current month, i.e. the opening balance. Companion of CLOSINGBALANCEMONTH.\n```DAX\nOpening = OPENINGBALANCEMONTH ( SUM ( Inventory[Units] ), 'Date'[Date] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/openingbalancemonth-function-dax"},{"id":"fc-0024","group":"semi-additive","front":"CLOSINGBALANCEYEAR","back":"Evaluates an expression at the last date of the year in the current context, giving the year-end balance for semi-additive facts.\n```DAX\nYear End Stock = CLOSINGBALANCEYEAR ( SUM ( Inventory[Units] ), 'Date'[Date] )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/closingbalanceyear-function-dax"},{"id":"fc-0025","group":"semi-additive","front":"FIRSTDATE / LASTDATE","back":"Return the first/last date in the current context as a one-row table. Used to snapshot semi-additive values at period boundaries.\n```DAX\nCALCULATE ( SUM ( Inventory[Units] ), LASTDATE ( 'Date'[Date] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/lastdate-function-dax"},{"id":"fc-0026","group":"calculation groups","front":"Calculation groups","back":"A model feature (authored in Tabular Editor) that applies reusable calculation logic (calculation items) across many measures, reducing measure sprawl for things like time intelligence.\n```DAX\nCurrent Measure -- placeholder replaced by SELECTEDMEASURE()\n```","sourceUrl":"https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups"},{"id":"fc-0027","group":"calculation groups","front":"SELECTEDMEASURE","back":"Placeholder inside a calculation item that references whatever measure is being evaluated, letting one item (e.g. YTD) apply to any measure.\n```DAX\nYTD = CALCULATE ( SELECTEDMEASURE (), DATESYTD ( 'Date'[Date] ) )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/selectedmeasure-function-dax"},{"id":"fc-0028","group":"calculation groups","front":"Calculation item precedence","back":"When multiple calculation groups apply, precedence determines the order they wrap the base measure. Higher precedence is applied last (outermost).\n```DAX\n-- Time Intelligence group precedence 10\n-- Currency group precedence 20 -> applied outermost\n```","sourceUrl":"https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups"},{"id":"fc-0029","group":"calculation groups","front":"SELECTEDMEASURENAME","back":"Returns the name of the measure currently being evaluated by a calculation item, enabling conditional logic (e.g. skip time intelligence for ratio measures).\n```DAX\nIF ( SELECTEDMEASURENAME () = \"Margin %\", SELECTEDMEASURE (), ... )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/selectedmeasurename-function-dax"},{"id":"fc-0030","group":"calculation groups","front":"ISSELECTEDMEASURE","back":"Returns TRUE if the measure being evaluated is one of a supplied list, used to apply or suppress a calculation item for specific measures.\n```DAX\nIF ( ISSELECTEDMEASURE ( [Sales], [Cost] ), SELECTEDMEASURE (), BLANK () )\n```","sourceUrl":"https://learn.microsoft.com/en-us/dax/isselectedmeasure-function-dax"}],"predictOutput":[{"id":"po-0001","model":"**Sales** (single table, no relationships)\n\n| Product | Qty | Price |\n|---|---|---|\n| A | 2 | 10 |\n| B | 3 | 20 |\n| C | 1 | 50 |","measure":"```DAX\nRevenue = SUMX ( Sales, Sales[Qty] * Sales[Price] )\n```","question":"What value does this measure return with no filters applied (grand total)?","options":[{"id":"a","text":"130"},{"id":"b","text":"80"},{"id":"c","text":"6"},{"id":"d","text":"480"}],"correct":["a"],"explanation":"SUMX iterates each row in row context: (2*10)+(3*20)+(1*50) = 20+60+50 = 130. It does not multiply the column sums (which would give 6*80=480).","sourceUrl":"https://learn.microsoft.com/en-us/dax/sumx-function-dax"},{"id":"po-0002","model":"**Sales**\n\n| Product | Qty | Price |\n|---|---|---|\n| A | 2 | 10 |\n| B | 3 | 20 |\n| C | 1 | 50 |","measure":"```DAX\nAvg Line Value = SUM ( Sales[Qty] ) * SUM ( Sales[Price] )\n```","question":"What value does this measure return at the grand total?","options":[{"id":"a","text":"480"},{"id":"b","text":"130"},{"id":"c","text":"160"},{"id":"d","text":"80"}],"correct":["a"],"explanation":"SUM aggregates each column independently before multiplying: SUM(Qty)=6, SUM(Price)=80, and 6*80=480. This is the classic wrong-way-to-compute-revenue pattern that SUMX avoids.","sourceUrl":"https://learn.microsoft.com/en-us/dax/sum-function-dax"},{"id":"po-0003","model":"**Sales** related to **Product** on ProductKey (Product filters Sales).\n\n**Product**\n\n| ProductKey | Color |\n|---|---|\n| 1 | Red |\n| 2 | Blue |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |\n| 1 | 50 |","measure":"```DAX\nRed Sales = CALCULATE ( SUM ( Sales[Amount] ), Product[Color] = \"Red\" )\n```","question":"In a card visual with no other filters, what does Red Sales return?","options":[{"id":"a","text":"150"},{"id":"b","text":"350"},{"id":"c","text":"200"},{"id":"d","text":"100"}],"correct":["a"],"explanation":"CALCULATE applies Product[Color]=\"Red\", which keeps ProductKey 1. Sales rows for key 1 are 100 and 50, summing to 150. The Blue row (200) is filtered out.","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"po-0004","model":"**Product** (filters Sales)\n\n| ProductKey | Color |\n|---|---|\n| 1 | Red |\n| 2 | Blue |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |","measure":"```DAX\nAll Color Sales = CALCULATE ( SUM ( Sales[Amount] ), ALL ( Product[Color] ) )\n```","question":"In a table visual with Product[Color] on rows, what value appears on the 'Red' row?","options":[{"id":"a","text":"300"},{"id":"b","text":"100"},{"id":"c","text":"200"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"The Red row provides a filter context of Color=Red, but ALL(Product[Color]) removes that filter, so the measure sums every Sales row: 100+200=300. Each color row shows the same 300, the classic denominator behavior.","sourceUrl":"https://learn.microsoft.com/en-us/dax/all-function-dax"},{"id":"po-0005","model":"**Product** (filters Sales)\n\n| ProductKey | Category | Color |\n|---|---|---|\n| 1 | Bikes | Red |\n| 2 | Bikes | Blue |\n| 3 | Gear | Red |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |\n| 3 | 40 |","measure":"```DAX\nCat Sales = CALCULATE ( SUM ( Sales[Amount] ), ALLEXCEPT ( Product, Product[Category] ) )\n```","question":"In a table with both Category and Color on rows, what does the (Bikes, Red) cell return?","options":[{"id":"a","text":"300"},{"id":"b","text":"100"},{"id":"c","text":"340"},{"id":"d","text":"440"}],"correct":["a"],"explanation":"ALLEXCEPT clears all Product filters except Category, so the Color=Red filter is removed but Category=Bikes remains. Bikes rows are ProductKeys 1 and 2: 100+200=300.","sourceUrl":"https://learn.microsoft.com/en-us/dax/allexcept-function-dax"},{"id":"po-0006","model":"**Product** (filters Sales); a slicer has selected Colors {Red, Blue}. Table visual rows show Color.\n\n**Product**\n\n| ProductKey | Color |\n|---|---|\n| 1 | Red |\n| 2 | Blue |\n| 3 | Green |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |\n| 3 | 90 |","measure":"```DAX\n% of Selected = DIVIDE ( SUM ( Sales[Amount] ), CALCULATE ( SUM ( Sales[Amount] ), ALLSELECTED ( Product[Color] ) ) )\n```","question":"With the slicer set to {Red, Blue}, what does the 'Red' row return?","options":[{"id":"a","text":"0.333 (about 33%)"},{"id":"b","text":"0.256 (about 26%)"},{"id":"c","text":"1.0 (100%)"},{"id":"d","text":"0.5 (50%)"}],"correct":["a"],"explanation":"The Red row numerator is 100. ALLSELECTED restores the slicer's outer selection {Red, Blue} but ignores the row's own Color filter, so the denominator is 100+200=300. 100/300 = 0.333. Green (90) is excluded because the slicer did not select it.","sourceUrl":"https://learn.microsoft.com/en-us/dax/allselected-function-dax"},{"id":"po-0007","model":"**Product** (filters Sales). Table visual rows show Color.\n\n**Product**\n\n| ProductKey | Color |\n|---|---|\n| 1 | Red |\n| 2 | Blue |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |","measure":"```DAX\nKeep Red = CALCULATE ( SUM ( Sales[Amount] ), KEEPFILTERS ( Product[Color] = \"Red\" ) )\n```","question":"On the 'Blue' row of the table, what value appears?","options":[{"id":"a","text":"BLANK"},{"id":"b","text":"200"},{"id":"c","text":"100"},{"id":"d","text":"300"}],"correct":["a"],"explanation":"KEEPFILTERS intersects the new Red filter with the row's existing Blue filter instead of overwriting it. Blue AND Red is empty, so the Blue row returns BLANK. Without KEEPFILTERS it would overwrite to Red and show 100.","sourceUrl":"https://learn.microsoft.com/en-us/dax/keepfilters-function-dax"},{"id":"po-0008","model":"**Date** (marked date table, filters Sales) with dates in 2024 and 2025. Visual filtered to Year = 2025.\n\n**Sales** (aggregated)\n\n| Year | Amount |\n|---|---|\n| 2024 | 500 |\n| 2025 | 800 |","measure":"```DAX\nPY Sales = CALCULATE ( SUM ( Sales[Amount] ), SAMEPERIODLASTYEAR ( 'Date'[Date] ) )\n```","question":"In a card filtered to Year 2025, what does PY Sales return?","options":[{"id":"a","text":"500"},{"id":"b","text":"800"},{"id":"c","text":"1300"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"SAMEPERIODLASTYEAR shifts the 2025 context back one year to 2024, so the measure returns 2024 sales = 500.","sourceUrl":"https://learn.microsoft.com/en-us/dax/sameperiodlastyear-function-dax"},{"id":"po-0009","model":"**Date** (marked, filters Sales), monthly grain. Visual filtered to March 2025.\n\n**Sales** (monthly)\n\n| Month | Amount |\n|---|---|\n| 2024-04 .. 2025-03 | see note |\n\nNote: every month from Apr-2024 through Mar-2025 has Amount = 10 (12 months). Feb-2024 and earlier have Amount = 99.","measure":"```DAX\nRolling 12M = CALCULATE ( SUM ( Sales[Amount] ), DATESINPERIOD ( 'Date'[Date], MAX ( 'Date'[Date] ), -12, MONTH ) )\n```","question":"With the visual filtered to March 2025, what does Rolling 12M return?","options":[{"id":"a","text":"120"},{"id":"b","text":"10"},{"id":"c","text":"219"},{"id":"d","text":"99"}],"correct":["a"],"explanation":"MAX('Date'[Date]) in the March 2025 context is the last day of March 2025. DATESINPERIOD spans back 12 months to Apr-2024 through Mar-2025, all at Amount=10, so 12*10 = 120. The pre-Apr-2024 months (99) fall outside the window.","sourceUrl":"https://learn.microsoft.com/en-us/dax/datesinperiod-function-dax"},{"id":"po-0010","model":"**Customer** (filters Sales, one-to-many).\n\n**Customer**\n\n| CustomerKey | Name |\n|---|---|\n| 1 | Ann |\n| 2 | Bob |\n\n**Sales**\n\n| CustomerKey | Amount |\n|---|---|\n| 1 | 100 |\n| 1 | 100 |\n| 2 | 300 |","measure":"```DAX\nCustomers Over 150 = COUNTROWS ( FILTER ( Customer, CALCULATE ( SUM ( Sales[Amount] ) ) > 150 ) )\n```","question":"With no external filters, what does this measure return?","options":[{"id":"a","text":"2"},{"id":"b","text":"1"},{"id":"c","text":"3"},{"id":"d","text":"0"}],"correct":["a"],"explanation":"FILTER iterates Customer in row context. CALCULATE triggers context transition, so per customer: Ann = 100+100 = 200 (>150, kept), Bob = 300 (>150, kept). Both qualify, so COUNTROWS = 2.","sourceUrl":"https://learn.microsoft.com/en-us/dax/filter-function-dax"},{"id":"po-0011","model":"**Product** (filters Sales). Table visual rows show Product[Name].\n\n**Product**\n\n| Name | -- |\n|---|---|\n| A |  |\n| B |  |\n| C |  |\n\n**Sales** (by product): A=300, B=500, C=200.","measure":"```DAX\nRank = RANKX ( ALL ( Product[Name] ), [Total Sales], , DESC, DENSE )\n```","question":"On the row for product A, what rank is returned?","options":[{"id":"a","text":"2"},{"id":"b","text":"1"},{"id":"c","text":"3"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"ALL(Product[Name]) is the ranking set with values B=500, A=300, C=200. Descending, B is 1, A is 2, C is 3. The current row context (A) makes [Total Sales]=300, whose rank is 2.","sourceUrl":"https://learn.microsoft.com/en-us/dax/rankx-function-dax"},{"id":"po-0012","model":"**Date** (marked, filters Sales). Visual filtered to Year 2025. Two calculation groups apply: 'Time Intelligence' with item YTD (precedence 10) and 'Currency' with item ToUSD (precedence 20, multiplies by 1.1).\n\n**Sales** cumulative through the filtered date in 2025 = 800 (local currency).","measure":"```DAX\n-- base measure\nTotal Sales = SUM ( Sales[Amount] )\n-- YTD item: CALCULATE ( SELECTEDMEASURE (), DATESYTD ( 'Date'[Date] ) )\n-- ToUSD item: SELECTEDMEASURE () * 1.1\n```","question":"With both calculation items applied to Total Sales (YTD then converted), what value is returned?","options":[{"id":"a","text":"880"},{"id":"b","text":"800"},{"id":"c","text":"800 * 1.1 then YTD, undefined"},{"id":"d","text":"1.1"}],"correct":["a"],"explanation":"Higher precedence is applied outermost. Currency (20) wraps Time Intelligence (10): ToUSD( YTD( Total Sales ) ). YTD gives 800, then *1.1 = 880. Precedence order determines the nesting, which yields 880.","sourceUrl":"https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups"}],"contextDrills":[{"id":"cd-0001","model":"**Sales** (single table, no relationships)\n\n| Product | Amount |\n|---|---|\n| A | 100 |\n| B | 200 |\n| C | 300 |","measure":"```DAX\nBad Total = SUMX ( Sales, SUM ( Sales[Amount] ) )\n```","question":"What does Bad Total return at the grand total, and why?","options":[{"id":"a","text":"1800 - SUM ignores row context and returns the full 600 for each of the 3 rows"},{"id":"b","text":"600 - SUM respects the current row"},{"id":"c","text":"100 - only the first row"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"SUM is an aggregator that ignores row context; it always sums the whole column (600) in the current filter context. SUMX iterates 3 rows and for each computes 600, giving 3*600 = 1800. This shows that aggregators do not read row context - you need CALCULATE for context transition.","sourceUrl":"https://learn.microsoft.com/en-us/dax/sumx-function-dax"},{"id":"cd-0002","model":"**Sales** (single table)\n\n| Product | Amount |\n|---|---|\n| A | 100 |\n| B | 200 |\n| C | 300 |","measure":"```DAX\nCT Total = SUMX ( Sales, CALCULATE ( SUM ( Sales[Amount] ) ) )\n```","question":"What does CT Total return at the grand total?","options":[{"id":"a","text":"600"},{"id":"b","text":"1800"},{"id":"c","text":"300"},{"id":"d","text":"100"}],"correct":["a"],"explanation":"CALCULATE performs context transition: the iterator's row context becomes a filter context for that single row. Because there are no other unique columns, each row filters to itself, giving 100, 200, 300, which SUMX adds to 600. Contrast with cd-0001 where the missing CALCULATE gave 1800.","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"cd-0003","model":"**Sales** calculated COLUMN (not a measure)\n\n| Product | Amount |\n|---|---|\n| A | 100 |\n| B | 200 |","measure":"```DAX\nShareCol = Sales[Amount] / SUM ( Sales[Amount] )\n```","question":"As a calculated column, what value does ShareCol hold in the row for product A?","options":[{"id":"a","text":"0.333 (100 / 300)"},{"id":"b","text":"1.0 (100 / 100)"},{"id":"c","text":"100"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"A calculated column has row context (Sales[Amount]=100 for A) but no filter context, so SUM(Sales[Amount]) ignores the row and returns the whole column total 300. Thus 100/300 = 0.333. Row context does not auto-filter aggregations.","sourceUrl":"https://learn.microsoft.com/en-us/dax/dax-calculated-columns"},{"id":"cd-0004","model":"**Product** (one-to-many to Sales)\n\n**Product**\n\n| ProductKey | Name |\n|---|---|\n| 1 | A |\n| 2 | B |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |","measure":"```DAX\nProdSalesCol = SUM ( Sales[Amount] )\n```","question":"Defined as a calculated column on the Product table, what does ProdSalesCol show for row A (ProductKey 1)?","options":[{"id":"a","text":"300 - row context on Product does not propagate through the relationship without CALCULATE"},{"id":"b","text":"100 - the relationship auto-filters Sales to A"},{"id":"c","text":"BLANK"},{"id":"d","text":"200"}],"correct":["a"],"explanation":"Row context does NOT automatically propagate across relationships. Without CALCULATE there is no context transition, so SUM(Sales[Amount]) sees no filter and returns the full 300 for every Product row. Wrapping in CALCULATE would give 100 for A.","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"cd-0005","model":"**Product** (one-to-many to Sales)\n\n**Product**\n\n| ProductKey | Name |\n|---|---|\n| 1 | A |\n| 2 | B |\n\n**Sales**\n\n| ProductKey | Amount |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |","measure":"```DAX\nProdSales = CALCULATE ( SUM ( Sales[Amount] ) )\n```","question":"As a calculated column on Product, what does ProdSales show for row A?","options":[{"id":"a","text":"100"},{"id":"b","text":"300"},{"id":"c","text":"200"},{"id":"d","text":"BLANK"}],"correct":["a"],"explanation":"CALCULATE with no filter arguments still performs context transition: Product's row context (ProductKey=1) becomes a filter context that propagates through the one-to-many relationship to Sales, filtering to Amount=100 for A.","sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax"},{"id":"cd-0006","model":"**Customer** (one-to-many to Sales)\n\n**Customer**\n\n| CustomerKey | Segment |\n|---|---|\n| 1 | Retail |\n| 2 | Retail |\n| 3 | Wholesale |\n\n**Sales**: Cust1=100, Cust2=250, Cust3=50.","measure":"```DAX\nBigCustomers = COUNTROWS ( FILTER ( VALUES ( Customer[CustomerKey] ), [Total Sales] > 150 ) )\n```","question":"With a visual filtered to Segment = Retail, what does BigCustomers return?","options":[{"id":"a","text":"1 - only Cust2 (250) exceeds 150 among Retail customers"},{"id":"b","text":"2 - Cust2 and Cust3"},{"id":"c","text":"3"},{"id":"d","text":"0"}],"correct":["a"],"explanation":"The Retail filter restricts VALUES(CustomerKey) to {1,2}. FILTER iterates them; [Total Sales] is a measure so context transition applies per customer: Cust1=100 (no), Cust2=250 (yes). Cust3 is Wholesale, excluded by the visual filter. Count = 1.","sourceUrl":"https://learn.microsoft.com/en-us/dax/filter-function-dax"},{"id":"cd-0007","model":"**Sales** (single table)\n\n| Region | Amount |\n|---|---|\n| North | 100 |\n| North | 200 |\n| South | 300 |","measure":"```DAX\nRegionShare = DIVIDE ( SUM ( Sales[Amount] ), CALCULATE ( SUM ( Sales[Amount] ), ALL ( Sales ) ) )\n```","question":"In a table visual with Region on rows, what does the North row show?","options":[{"id":"a","text":"0.5 (300 / 600)"},{"id":"b","text":"0.333 (200 / 600)"},{"id":"c","text":"1.0"},{"id":"d","text":"0.167 (100 / 600)"}],"correct":["a"],"explanation":"The North row filter context sums both North rows: 100+200=300 (numerator). ALL(Sales) removes all filters for the denominator: 600. 300/600 = 0.5. Row context is not involved here - this is pure filter-context manipulation in a visual.","sourceUrl":"https://learn.microsoft.com/en-us/dax/all-function-dax"},{"id":"cd-0008","model":"**Product** (one-to-many to Sales). Table visual rows show Product[Category].\n\n**Product**\n\n| ProductKey | Category |\n|---|---|\n| 1 | Bikes |\n| 2 | Bikes |\n| 3 | Gear |\n\n**Sales**: PK1=100, PK2=200, PK3=50.","measure":"```DAX\nAvgProductSales = AVERAGEX ( VALUES ( Product[ProductKey] ), [Total Sales] )\n```","question":"On the 'Bikes' row of the table, what does AvgProductSales return?","options":[{"id":"a","text":"150 - average of PK1 (100) and PK2 (200)"},{"id":"b","text":"300 - sum of Bikes"},{"id":"c","text":"116.7 - average of all three products"},{"id":"d","text":"100"}],"correct":["a"],"explanation":"The Bikes row context restricts VALUES(ProductKey) to {1,2}. AVERAGEX establishes row context per key; [Total Sales] uses context transition to get 100 and 200; the average is (100+200)/2 = 150. PK3 (Gear) is outside the Bikes filter.","sourceUrl":"https://learn.microsoft.com/en-us/dax/averagex-function-dax"}]}};
const Q = DATA.questions, CS = DATA.caseStudies, DR = DATA.drills;

/* ---------- utils ---------- */
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inl(s){return s
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');}
function md(src){
  src=esc(src).replace(/\r\n/g,"\n");const L=src.split("\n");let h="",i=0;
  while(i<L.length){const line=L[i];
    const f=line.match(/^```(\w*)\s*$/);
    if(f){i++;let b=[];while(i<L.length&&!/^```\s*$/.test(L[i])){b.push(L[i]);i++;}i++;h+="<pre><code>"+b.join("\n")+"</code></pre>";continue;}
    if(line.includes("|")&&i+1<L.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])&&L[i+1].includes("-")){
      const p=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const hd=p(line);i+=2;const rs=[];while(i<L.length&&L[i].includes("|")){rs.push(p(L[i]));i++;}
      h+='<div class="twrap"><table><thead><tr>'+hd.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>"+
        rs.map(r=>"<tr>"+r.map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";continue;}
    if(/^\s*[-*]\s+/.test(line)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*]\s+/,""));i++;}h+="<ul>"+it.map(t=>"<li>"+inl(t)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\d+\.\s+/.test(line)){const it=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+\.\s+/,""));i++;}h+="<ol>"+it.map(t=>"<li>"+inl(t)+"</li>").join("")+"</ol>";continue;}
    if(line.trim()===""){i++;continue;}
    const pr=[];while(i<L.length&&L[i].trim()!==""&&!/^```/.test(L[i])&&!/^\s*[-*]\s+/.test(L[i])&&!/^\s*\d+\.\s+/.test(L[i])){pr.push(L[i]);i++;}
    h+="<p>"+inl(pr.join(" "))+"</p>";}
  return h;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function eqSet(a,b){if(a.length!==b.length)return false;const s=new Set(b);return a.every(x=>s.has(x));}
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function scaled(acc){acc=Math.max(0,Math.min(1,acc));return Math.round(acc<=.7?100+acc/.7*600:700+(acc-.7)/.3*300);}
function load(k,d){try{return JSON.parse(localStorage.getItem("pl300_"+k))??d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("pl300_"+k,JSON.stringify(v));}catch(e){}}

  `<button data-go="${r}" class="${route.startsWith(r)&&r!=="home"||route===r?"on":""}">${l}</button>`).join("");}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  const a=e.target.closest("[data-act]");if(a){handle(a.dataset.act,a.dataset,a);}
});

/* ---------- markup helpers ---------- */
function optionRow(q,oid,text,idx,{selected,revealed}){
  const isSel=selected.includes(oid), isRight=q.correct.includes(oid);
  let cls="opt"+(q.type==="multi"?" multi":"");
  let key=String.fromCharCode(65+idx);
  if(revealed){ if(isRight)cls+=" correct"; else if(isSel)cls+=" wrong";
    if(isRight&&!isSel)cls+=" miss"; }
  else if(isSel)cls+=" sel";
  const kc=revealed?(isRight?"✓":(isSel?"✕":key)):(isSel&&q.type!=="multi"?key:(isSel?"✓":key));
  return `<button class="${cls}" data-act="pick" data-oid="${oid}" ${revealed?"disabled":""}>
    <span class="key">${kc}</span><span class="md">${md(text)}</span></button>`;
}
function questionBlock(q,i,total,{selected,revealed,flagged,flagBtn}){
  const hint={single:"Choose ONE.",multi:"Choose ALL that apply.",dropdown:"Select the correct option.",
    dragdrop:"Select the option that orders items correctly.",hotspot:"Select the correct statement.",caseStudy:""}[q.type]||"";
  return `<div class="meta">
      <span class="mono">Q${i+1}/${total}</span>
      <span class="pill blue">${esc(q.objective)}</span>
      <span class="pill">${esc(q.subObjective)}</span>
      <span class="pill amber">Diff ${q.difficulty}</span>
      ${q.caseStudyId?'<span class="pill good">Case study</span>':""}
      ${flagBtn?`<button class="pill ${flagged?'amber':''}" data-act="flag" style="cursor:pointer">⚑ ${flagged?"Flagged":"Flag"}</button>`:""}
    </div>
    <div class="eyebrow" style="color:var(--accent-ink);margin-bottom:8px">${hint}</div>
    <div class="md" style="font-size:15.5px">${md(q.stem)}</div>
    ${q.exhibit?`<div class="exhibit"><div class="eyebrow" style="margin-bottom:6px">Exhibit</div><div class="md" style="font-size:13.5px">${md(q.exhibit)}</div></div>`:""}
    <div>${q.options.map((o,idx)=>optionRow(q,o.id,o.text,idx,{selected,revealed})).join("")}</div>
    ${revealed?explBlock(q):""}`;
}
function explBlock(q){
  const wn=q.explanation.whyNot||{};
  return `<div class="expl">
    <div class="lab good">Why this is correct</div>
    <div class="md" style="font-size:14px">${md(q.explanation.why)}</div>
    ${Object.keys(wn).length?`<div class="lab bad" style="margin-top:10px">Why the others are wrong</div>
      <ul style="font-size:14px">${Object.entries(wn).map(([k,v])=>`<li><strong>${k.toUpperCase()}.</strong> ${inl(esc(v))}</li>`).join("")}</ul>`:""}
    <div style="margin-top:10px"><a href="${esc(q.sourceUrl)}" target="_blank" rel="noreferrer">↗ Microsoft Learn source</a></div>
  </div>`;
}
