 row, not just Customer. For the first Ann row the transitioned filter is Customer=\"Ann\" AND Sales=100. This table has no unique key, so that combined filter matches only that one row, and the measure returns 100. To get Ann's true total (400) the transition would need to filter on Customer alone — which requires a unique row identifier (or grouping by Customer in a visual), so that the Sales value is not also part of the filter.","whyNot":{"a":"400 (100 + 300) is Ann's total, which you would get only if the transition filtered on Customer alone. Because context transition also filters on Sales=100, the second Ann row (Sales=300) is excluded.","c":"600 is the grand total of all rows; context transition adds filters, it does not remove them, so the calculated column is never the whole-table total.","d":"300 is the other Ann row's value; the current row context is the FIRST Ann row (Sales=100), whose transitioned filter matches Sales=100, not 300."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax","tags":["context-transition","CALCULATE","calculated-column","predict-output"]},{"id":"model-dax-0016","domain":"model","objective":"Create model calculations by using DAX","subObjective":"SUMX iterator row-by-row evaluation","type":"single","difficulty":2,"stem":"Using the **Sales** table below, evaluate the following measure. What value does it return?\n\n```DAX\nRevenue =\nSUMX(Sales, Sales[Qty] * Sales[Price])\n```","exhibit":"Sales\n\n| Qty | Price |\n|-----|-------|\n| 2   | 10    |\n| 3   | 20    |\n| 1   | 50    |","options":[{"id":"a","text":"130"},{"id":"b","text":"480"},{"id":"c","text":"80"},{"id":"d","text":"6"}],"correct":["a"],"explanation":{"why":"SUMX iterates row by row, multiplying Qty by Price on each row and then summing: (2*10) + (3*20) + (1*50) = 20 + 60 + 50 = 130.","whyNot":{"b":"480 is SUM(Qty) * SUM(Price) = 6 * 80, which multiplies the totals instead of computing per-row products.","c":"80 is only SUM(Price) and ignores quantities and the multiplication entirely.","d":"6 is only SUM(Qty); it ignores price and the row-level multiplication."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/sumx-function-dax","tags":["SUMX","iterator","row-context","predict-output"]},{"id":"model-dax-0017","domain":"model","objective":"Create model calculations by using DAX","subObjective":"AVERAGEX over an expression","type":"single","difficulty":2,"stem":"Using the same **Sales** table, evaluate `Avg Line Revenue = AVERAGEX(Sales, Sales[Qty] * Sales[Price])`. What value does it return (rounded to two decimals)?","exhibit":"Sales\n\n| Qty | Price |\n|-----|-------|\n| 2   | 10    |\n| 3   | 20    |\n| 1   | 50    |\n\nRow revenues: 20, 60, 50","options":[{"id":"a","text":"43.33"},{"id":"b","text":"130.00"},{"id":"c","text":"160.00"},{"id":"d","text":"26.67"}],"correct":["a"],"explanation":{"why":"AVERAGEX computes the per-row expression (20, 60, 50) and averages the three results: (20 + 60 + 50) / 3 = 130 / 3 = 43.33.","whyNot":{"b":"130 is the SUMX total, not the average across the three rows.","c":"160 = 480/3 would be the average of SUM(Qty)*SUM(Price) mishandled; it does not match the per-row averaging.","d":"26.67 = 80/3 averages only the prices' total incorrectly and ignores quantities."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/averagex-function-dax","tags":["AVERAGEX","iterator","predict-output"]},{"id":"model-dax-0018","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Variables with VAR and RETURN","type":"single","difficulty":2,"stem":"You are optimizing a measure that references the same sub-expression multiple times and want to improve readability and avoid recomputing it. Which rewrite correctly uses variables?","exhibit":"Original: YoY % = DIVIDE([Sales] - CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date])), CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date])))","options":[{"id":"a","text":"```DAX\nYoY % =\nVAR PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN DIVIDE([Sales] - PY, PY)\n```"},{"id":"b","text":"```DAX\nYoY % =\nVAR PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nDIVIDE([Sales] - PY, PY)\n```"},{"id":"c","text":"```DAX\nYoY % =\nRETURN DIVIDE([Sales] - PY, PY)\nVAR PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date]))\n```"},{"id":"d","text":"```DAX\nYoY % =\nVAR PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date]))\nRETURN PY = DIVIDE([Sales] - PY, PY)\n```"}],"correct":["a"],"explanation":{"why":"A variable is declared with VAR, and the expression that uses it must follow a single RETURN. Option a defines PY once and returns the DIVIDE that reuses it, improving readability and evaluating the prior-year value a single time.","whyNot":{"b":"It omits the required RETURN keyword before the final expression, so the syntax is invalid.","c":"RETURN must come after the VAR declarations, not before them; this ordering is invalid.","d":"Reassigning PY inside RETURN is invalid; variables are immutable and RETURN takes one expression, not an assignment."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/var-dax","tags":["variables","VAR","RETURN","readability"]},{"id":"model-dax-0019","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Semi-additive measures (closing balance)","type":"single","difficulty":3,"stem":"You track daily inventory **on-hand quantity** in a snapshot fact table. Summing on-hand across dates is meaningless (you would add the same stock repeatedly), but summing across products on a given date is valid. For a monthly report you need the on-hand quantity **as of the last date in each period**. Which measure is appropriate for this semi-additive value?","options":[{"id":"a","text":"```DAX\nClosing On Hand =\nCALCULATE(SUM(Inventory[OnHand]), LASTDATE('Date'[Date]))\n```"},{"id":"b","text":"```DAX\nClosing On Hand =\nSUM(Inventory[OnHand])\n```"},{"id":"c","text":"```DAX\nClosing On Hand =\nAVERAGE(Inventory[OnHand])\n```"},{"id":"d","text":"```DAX\nClosing On Hand =\nCALCULATE(SUM(Inventory[OnHand]), ALL('Date'))\n```"}],"correct":["a"],"explanation":{"why":"On-hand quantity is semi-additive: additive across products but not across time. Wrapping SUM in CALCULATE with LASTDATE restricts the date filter to the final date of the current period, giving the correct closing balance.","whyNot":{"b":"A plain SUM adds on-hand across all dates in the period, double-counting the same stock over time.","c":"AVERAGE returns a mean across snapshots, which is neither the closing balance nor a meaningful stock figure.","d":"ALL('Date') removes the date filter entirely and sums across the whole model timeline, worsening the double-counting."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/lastdate-function-dax","tags":["semi-additive","LASTDATE","closing-balance","inventory"]},{"id":"model-dax-0020","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Implicit vs explicit measures","type":"single","difficulty":1,"stem":"A report author drags the numeric column **Sales[Amount]** onto a visual and Power BI auto-aggregates it as Sum. A reviewer says the model should instead expose a governed, reusable **explicit measure**. What distinguishes an explicit measure from this implicit aggregation?","options":[{"id":"a","text":"An explicit measure is a named measure you author with a DAX expression (for example Total Sales = SUM(Sales[Amount])), giving reusable, controlled logic; the implicit one is the automatic column aggregation."},{"id":"b","text":"An explicit measure is any column you rename; implicit measures are columns you hide."},{"id":"c","text":"There is no functional difference; both are stored per row in the model."},{"id":"d","text":"An explicit measure can only be a calculated column, not a measure."}],"correct":["a"],"explanation":{"why":"An explicit measure is one you deliberately define with a DAX formula and a name, so it is reusable, testable, and centrally governed. An implicit measure is the automatic aggregation Power BI applies when a numeric column is dropped on a visual.","whyNot":{"b":"Renaming or hiding columns has nothing to do with explicit versus implicit measures.","c":"They differ meaningfully; measures are evaluated at query time and are not stored per row like columns.","d":"An explicit measure is a measure, not a calculated column; the statement inverts the concept."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-measures","tags":["explicit-measures","implicit-measures","governance"]},{"id":"model-dax-0021","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Visual calculations","type":"single","difficulty":2,"stem":"You need a running total of Sales **within a single matrix visual**, computed across the exact rows already displayed (respecting their sort and grouping), without adding a new model measure. Which Power BI feature is designed for this?","options":[{"id":"a","text":"A visual calculation, such as RUNNINGSUM([Sales Amount]), authored on the visual itself."},{"id":"b","text":"A calculated column added to the fact table."},{"id":"c","text":"A row-level security rule filtering the Sales table."},{"id":"d","text":"A relationship with bidirectional cross-filtering to the Date table."}],"correct":["a"],"explanation":{"why":"Visual calculations are DAX expressions defined on a specific visual that operate over the visual's already-computed result grid, making running totals and moving averages simple without adding model objects. RUNNINGSUM over the displayed axis is exactly this use case.","whyNot":{"b":"A calculated column is materialized at refresh across the whole table and cannot respect a single visual's displayed rows and sort.","c":"Row-level security restricts data access; it does not compute running totals.","d":"Changing cross-filter direction affects filtering, not the in-visual running total."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-visual-calculations-overview","tags":["visual-calculations","running-total","RUNNINGSUM"]},{"id":"model-dax-0022","domain":"model","objective":"Create model calculations by using DAX","subObjective":"FILTER inside CALCULATE (filter context)","type":"single","difficulty":3,"stem":"Using the **Sales** table below, evaluate the following measure. What value does it return?\n\n```DAX\nBig Sales =\nCALCULATE(\n    SUM(Sales[Amount]),\n    FILTER(Sales, Sales[Amount] > 200)\n)\n```","exhibit":"Sales\n\n| Product | Amount |\n|---------|--------|\n| A       | 100    |\n| B       | 250    |\n| C       | 400    |","options":[{"id":"a","text":"650"},{"id":"b","text":"750"},{"id":"c","text":"400"},{"id":"d","text":"250"}],"correct":["a"],"explanation":{"why":"FILTER returns only the rows where Amount > 200 (Product B = 250 and Product C = 400). CALCULATE then sums Amount over just those rows: 250 + 400 = 650.","whyNot":{"b":"750 sums all three rows (100 + 250 + 400) and ignores the FILTER condition.","c":"400 keeps only Product C and wrongly drops Product B, which also exceeds 200.","d":"250 keeps only Product B and drops Product C, which also exceeds 200."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/filter-function-dax","tags":["FILTER","CALCULATE","filter-context","predict-output"]},{"id":"model-dax-0023","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Context transition when a measure is inside an iterator","type":"single","difficulty":3,"stem":"You write `Customers Above Target = COUNTROWS(FILTER(VALUES(Customer[CustomerKey]), [Total Sales] > 1000))`. Inside the FILTER, the measure [Total Sales] evaluates per customer even though CustomerKey is the only column iterated. Which DAX behavior makes [Total Sales] resolve to each customer's own sales?","options":[{"id":"a","text":"Context transition: referencing a measure inside a row context implicitly wraps it in CALCULATE, turning the current row into a filter."},{"id":"b","text":"Row context automatically becomes filter context for measures without any transition."},{"id":"c","text":"VALUES removes all filters, so [Total Sales] returns the grand total for every customer."},{"id":"d","text":"FILTER ignores measures entirely and evaluates only columns."}],"correct":["a"],"explanation":{"why":"A measure reference is implicitly surrounded by CALCULATE, which triggers context transition: the current row of the iterated CustomerKey becomes a filter, so [Total Sales] is evaluated for that specific customer. That is why per-customer comparison works.","whyNot":{"b":"Row context does not automatically act as filter context; a transition (via the implicit CALCULATE around the measure) is required.","c":"VALUES(Customer[CustomerKey]) returns the customers in context but does not force the measure to the grand total; context transition still applies per row.","d":"FILTER can and does evaluate measures; the claim that it ignores measures is false."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax","tags":["context-transition","iterator","FILTER","measures"]},{"id":"model-dax-0024","domain":"model","objective":"Create model calculations by using DAX","subObjective":"CALCULATE filter modifiers behavior","type":"multi","difficulty":3,"stem":"A teammate is confused about CALCULATE filter modifiers. Which of the following statements are **true**? **Select all that apply.**","options":[{"id":"a","text":"By default, a Boolean filter argument in CALCULATE overwrites (replaces) any existing filter on that same column."},{"id":"b","text":"KEEPFILTERS changes that behavior so the new condition is added to (intersected with) the existing filter instead of replacing it."},{"id":"c","text":"REMOVEFILTERS clears filters from the specified table or columns."},{"id":"d","text":"ALL used as a CALCULATE modifier adds a brand-new restrictive filter rather than removing existing ones."},{"id":"e","text":"USERELATIONSHIP is a filter modifier that removes all filters from the fact table."}],"correct":["a","b","c"],"explanation":{"why":"A plain Boolean filter in CALCULATE replaces the current filter on that column; KEEPFILTERS instead intersects the new condition with the existing one; and REMOVEFILTERS clears filters on the given table or columns. These three describe modifier behavior accurately.","whyNot":{"d":"ALL used inside CALCULATE removes filters (acts like REMOVEFILTERS on the specified scope); it does not add a restrictive filter.","e":"USERELATIONSHIP activates an inactive relationship for the calculation; it does not remove filters from the fact table."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/calculate-function-dax","tags":["CALCULATE","filter-modifiers","KEEPFILTERS","REMOVEFILTERS"]},{"id":"model-dax-0025","domain":"model","objective":"Create model calculations by using DAX","subObjective":"Matching time-intelligence functions to needs","type":"dragdrop","difficulty":2,"stem":"Drag the correct time-intelligence function to each requirement. The three requirement slots, in order, are: **(1)** cumulative total from the start of the year to the current date; **(2)** the value for the equivalent period one year earlier; **(3)** the set of dates in the month up to and including the current date. Select the option that lists the correct function for slot 1, then slot 2, then slot 3.","exhibit":"Available functions: TOTALYTD, SAMEPERIODLASTYEAR, DATESMTD, PREVIOUSYEAR","options":[{"id":"a","text":"Slot 1 = TOTALYTD, Slot 2 = SAMEPERIODLASTYEAR, Slot 3 = DATESMTD"},{"id":"b","text":"Slot 1 = DATESMTD, Slot 2 = TOTALYTD, Slot 3 = SAMEPERIODLASTYEAR"},{"id":"c","text":"Slot 1 = SAMEPERIODLASTYEAR, Slot 2 = DATESMTD, Slot 3 = TOTALYTD"},{"id":"d","text":"Slot 1 = TOTALYTD, Slot 2 = PREVIOUSYEAR, Slot 3 = SAMEPERIODLASTYEAR"}],"correct":["a"],"explanation":{"why":"TOTALYTD returns a year-to-date cumulative aggregation; SAMEPERIODLASTYEAR shifts the current period back one year for a like-for-like comparison; DATESMTD returns the month-to-date set of dates. Option a maps each requirement to the right function.","whyNot":{"b":"It assigns DATESMTD to the YTD cumulative slot and TOTALYTD to the prior-year slot, which are both wrong roles.","c":"It places SAMEPERIODLASTYEAR in the YTD slot and TOTALYTD in the month-to-date slot, mismatching all three.","d":"PREVIOUSYEAR returns all dates of the prior year rather than the equivalent period, so slot 2 is wrong, and slot 3 (SAMEPERIODLASTYEAR) is not month-to-date."}},"sourceUrl":"https://learn.microsoft.com/en-us/dax/totalytd-function-dax","tags":["time-intelligence","TOTALYTD","DATESMTD","dragdrop"]},{"id":"model-opt-0026","domain":"model","objective":"Optimize model performance","subObjective":"Performance Analyzer to find slow visuals","type":"single","difficulty":1,"stem":"A report page renders slowly and you need to find out whether a specific visual's delay comes from its DAX query, visual display, or other operations. Which built-in Power BI Desktop tool should you use first?","options":[{"id":"a","text":"Performance Analyzer, which records per-visual timings for DAX query, visual display, and other, and can copy the generated DAX query."},{"id":"b","text":"Manage roles (row-level security) dialog."},{"id":"c","text":"The Format pane's conditional formatting options."},{"id":"d","text":"Publish to the Power BI service and read the workspace usage metrics."}],"correct":["a"],"explanation":{"why":"Performance Analyzer records how long each visual takes, broken into DAX query, visual display, and other, so you can pinpoint whether the query or rendering is the bottleneck. It also lets you copy the underlying DAX query for deeper analysis.","whyNot":{"b":"Manage roles configures security, not performance measurement.","c":"Conditional formatting affects appearance, not diagnosing slow visuals.","d":"Usage metrics show adoption patterns, not the per-visual query/render breakdown you need locally."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-performance-analyzer","tags":["performance-analyzer","diagnostics","optimization"]},{"id":"model-opt-0027","domain":"model","objective":"Optimize model performance","subObjective":"Reduce cardinality to shrink the model","type":"single","difficulty":2,"stem":"An Import model is very large. You find a **DateTime** column storing order timestamps to the second, used only for date-level reporting. It has millions of unique values. Which change best reduces model size while preserving the analysis you actually need?","options":[{"id":"a","text":"Split it into a Date column and (if needed) a separate Time column, so the high-cardinality combined values are removed and column compression improves."},{"id":"b","text":"Change the visuals' theme to a darker color to reduce rendering load."},{"id":"c","text":"Set the relationship to bidirectional to compress the column."},{"id":"d","text":"Keep the second-level timestamps but add more measures to offset the size."}],"correct":["a"],"explanation":{"why":"Cardinality (number of distinct values) drives VertiPaq column size. Splitting a second-precision DateTime into a lower-cardinality Date column (and optional Time) dramatically reduces distinct values and improves compression while still supporting date-level reporting.","whyNot":{"b":"Visual color themes have no effect on model storage or cardinality.","c":"Cross-filter direction changes filtering behavior; it does not compress a column or lower cardinality.","d":"Adding measures does not reduce the size of a high-cardinality column and does nothing to offset storage."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/guidance/import-modeling-data-reduction","tags":["cardinality","column-size","VertiPaq","optimization"]},{"id":"model-opt-0028","domain":"model","objective":"Optimize model performance","subObjective":"Techniques to reduce model size","type":"multi","difficulty":2,"stem":"You must reduce the size and improve the refresh/query performance of an Import semantic model. Which techniques align with Microsoft's data-reduction guidance? **Select all that apply.**","options":[{"id":"a","text":"Remove columns that are not used by any report or measure."},{"id":"b","text":"Filter rows to load only the history the business actually needs (for example, remove years no one reports on)."},{"id":"c","text":"Reduce column cardinality, such as splitting high-precision DateTime columns."},{"id":"d","text":"Import every raw source column just in case someone might need it later."},{"id":"e","text":"Disable Auto date/time only when you have your own date table, but never remove any columns."}],"correct":["a","b","c"],"explanation":{"why":"Removing unused columns, filtering out unneeded rows, and lowering cardinality are all core data-reduction techniques that shrink the model and speed up queries and refresh. They directly reduce what VertiPaq must store and scan.","whyNot":{"d":"Importing every column speculatively inflates the model and works against data reduction; you should keep only what is needed.","e":"Disabling Auto date/time is a good practice, but the clause 'never remove any columns' contradicts the recommended removal of unused columns, making the statement false."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/guidance/import-modeling-data-reduction","tags":["data-reduction","unused-columns","row-filtering","optimization"]},{"id":"model-opt-0029","domain":"model","objective":"Optimize model performance","subObjective":"DAX query view for triage","type":"single","difficulty":2,"stem":"You copied a slow visual's DAX query from Performance Analyzer and want to run it repeatedly, tweak it, and compare timings inside Power BI Desktop without building visuals. Which feature lets you author and execute DAX queries against the model directly?","options":[{"id":"a","text":"DAX query view, where you can write and run DAX queries (for example EVALUATE) against the semantic model."},{"id":"b","text":"The Sync slicers pane."},{"id":"c","text":"The Selection pane."},{"id":"d","text":"The Bookmarks pane."}],"correct":["a"],"explanation":{"why":"DAX query view lets you author and execute DAX queries (such as EVALUATE statements) directly against the model, which is ideal for pasting a captured query, iterating on it, and triaging performance without visuals.","whyNot":{"b":"Sync slicers coordinates slicers across pages; it does not run DAX queries.","c":"The Selection pane manages visual visibility and z-order, not query execution.","d":"The Bookmarks pane captures report states; it cannot author or run DAX queries."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view","tags":["dax-query-view","EVALUATE","triage","optimization"]},{"id":"model-opt-0030","domain":"model","objective":"Optimize model performance","subObjective":"DirectQuery optimization","type":"single","difficulty":3,"stem":"A DirectQuery model over a large SQL source is slow because each visual sends complex queries and many round trips to the source. Following Microsoft's DirectQuery guidance, which action is most likely to improve performance?","options":[{"id":"a","text":"Optimize the source (indexing, aggregations, a star-schema relational design) and reduce the number and complexity of visuals per page so fewer, simpler queries are generated."},{"id":"b","text":"Add more visuals to each page so the source can batch all queries at once."},{"id":"c","text":"Convert every relationship to bidirectional to reduce the number of queries."},{"id":"d","text":"Increase the decimal precision of all numeric columns to help the engine."}],"correct":["a"],"explanation":{"why":"In DirectQuery, the source database does the work, so tuning it (indexes, pre-aggregations, a clean star schema) and limiting how many complex visuals fire queries per page directly reduces load and latency. Composite models with aggregations are also recommended for large sources.","whyNot":{"b":"More visuals generate more concurrent source queries and round trips, worsening performance.","c":"Bidirectional relationships tend to add query complexity and can hurt DirectQuery performance rather than help.","d":"Higher numeric precision does not speed up DirectQuery and can increase data movement."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/guidance/directquery-model-guidance","tags":["directquery","optimization","source-tuning"]},{"id":"model-opt-0031","domain":"model","objective":"Optimize model performance","subObjective":"Interpreting Performance Analyzer output","type":"hotspot","difficulty":2,"stem":"In the Performance Analyzer pane below, a table visual is expanded to show its timing breakdown. You must select the single metric that tells you how long the semantic model took to return data for the visual (so you can decide whether to tune the DAX or the model). Which labeled entry should you click?","exhibit":"Performance Analyzer > Table visual (expanded)\n\n| Label | Value |\n|-------|-------|\n| (a) DAX query | 4,820 ms |\n| (b) Visual display | 120 ms |\n| (c) Other | 60 ms |\n| (d) Total | 5,000 ms |","options":[{"id":"a","text":"DAX query (4,820 ms)"},{"id":"b","text":"Visual display (120 ms)"},{"id":"c","text":"Other (60 ms)"},{"id":"d","text":"Total (5,000 ms)"}],"correct":["a"],"explanation":{"why":"The DAX query metric is the time the semantic model spent executing the query and returning results for the visual. A large DAX query value (here 4,820 ms of 5,000 ms) points you toward optimizing the DAX or the model rather than rendering.","whyNot":{"b":"Visual display is the time to render the result on screen, not the model's query time.","c":"Other covers background/overhead operations such as preparing queries, not the query execution itself.","d":"Total is the sum of all phases and does not isolate the model query time you need to target."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-performance-analyzer","tags":["performance-analyzer","dax-query","interpretation","hotspot"]},{"id":"viz-rep-0001","domain":"visualize","objective":"Create reports","subObjective":"Choose the appropriate visualization","type":"single","difficulty":1,"stem":"You are building a sales report. Management wants to see **total revenue broken down by product category**, ordered from highest to lowest, so they can quickly compare category performance at a glance.\n\nWhich visualization should you use?","exhibit":"A single table with columns: ProductCategory (text), Revenue (currency). There are 8 product categories.","options":[{"id":"a","text":"Bar chart"},{"id":"b","text":"Line chart"},{"id":"c","text":"Scatter chart"},{"id":"d","text":"Gauge"}],"correct":["a"],"explanation":{"why":"A bar chart is the standard choice for comparing a single measure across a categorical dimension. Bars can be sorted descending so the highest category appears first, making comparison immediate.","whyNot":{"b":"Line charts are designed to show a trend of a value over a continuous axis such as time, not to compare discrete categories.","c":"Scatter charts show the relationship between two (or three) numeric measures across items, not a single measure by category.","d":"A gauge displays progress of a single value toward a target; it cannot break a measure down across multiple categories."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a","tags":["visualization-choice","bar-chart"]},{"id":"viz-rep-0002","domain":"visualize","objective":"Create reports","subObjective":"Choose the appropriate visualization","type":"single","difficulty":2,"stem":"A logistics analyst must display a **single delivery-performance percentage against a defined target** on an executive summary page. The visual should show the current value, the target, and how far the value is from the target using a radial arc.\n\nWhich visualization best meets this requirement?","options":[{"id":"a","text":"Gauge chart"},{"id":"b","text":"KPI visual"},{"id":"c","text":"Card"},{"id":"d","text":"Clustered column chart"}],"correct":["a"],"explanation":{"why":"A gauge chart shows a single value on a circular arc between a minimum and maximum, with a target line, making it ideal for showing progress toward a goal.","whyNot":{"b":"The KPI visual shows a value, a goal, and a trend over time, but it uses a status indicator and trend line rather than a radial arc.","c":"A card shows only a single number with no target or arc.","d":"A clustered column chart compares values across categories and does not depict progress toward a target on an arc."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-radial-gauge-charts","tags":["visualization-choice","gauge"]},{"id":"viz-rep-0003","domain":"visualize","objective":"Create reports","subObjective":"Choose the appropriate visualization","type":"single","difficulty":2,"stem":"You need a visual that shows a **single metric with its value, a goal, and whether the metric is trending up or down over the last 12 months**. The audience only cares about the latest status relative to target, plus direction of the trend.\n\nWhich visual should you choose?","options":[{"id":"a","text":"KPI visual"},{"id":"b","text":"Gauge chart"},{"id":"c","text":"Multi-row card"},{"id":"d","text":"Line chart"}],"correct":["a"],"explanation":{"why":"The KPI visual is purpose-built to show a base value, a target goal, and a trend axis, with color-coded status indicating whether the metric is on track.","whyNot":{"b":"A gauge shows current value against min/max and target but does not incorporate a trend over time.","c":"A multi-row card lists several values as text but has no goal or trend evaluation.","d":"A line chart shows the trend but does not summarize status against a goal in a single indicator."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-kpi","tags":["visualization-choice","kpi"]},{"id":"viz-rep-0004","domain":"visualize","objective":"Create reports","subObjective":"Apply conditional formatting","type":"single","difficulty":1,"stem":"In a table visual showing **Profit by Region**, you want each cell's background in the Profit column to shade from red (lowest) to green (highest) based on the profit value, so outliers stand out.\n\nWhich conditional formatting option should you configure on the Profit field?","options":[{"id":"a","text":"Background color, formatted by Color scale"},{"id":"b","text":"Data bars"},{"id":"c","text":"Icons"},{"id":"d","text":"Web URL"}],"correct":["a"],"explanation":{"why":"Background color conditional formatting using a color scale (gradient) shades each cell along a min-to-max color ramp based on the field value, which is exactly the red-to-green heat effect requested.","whyNot":{"b":"Data bars draw a proportional bar inside the cell rather than shading the cell background across a color gradient.","c":"Icons place a small indicator (such as arrows or KPI symbols) but do not shade the cell background as a gradient.","d":"Web URL formatting turns cell text into a clickable link and has nothing to do with color shading."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-conditional-table-formatting","tags":["conditional-formatting","table"]},{"id":"viz-rep-0005","domain":"visualize","objective":"Create reports","subObjective":"Apply conditional formatting","type":"dropdown","difficulty":2,"stem":"A finance table lists accounts with a **Variance** column. You must show a red down-arrow when variance is negative and a green up-arrow when positive, without changing the cell background.\n\nComplete the sentence by choosing the correct option: To achieve this you should apply conditional formatting of type **[ ... ]** to the Variance column.","options":[{"id":"a","text":"Icons"},{"id":"b","text":"Background color"},{"id":"c","text":"Font color"},{"id":"d","text":"Data bars"}],"correct":["a"],"explanation":{"why":"The Icons conditional formatting option displays rule-based indicator icons (such as directional arrows) next to values, and rules can be set on the numeric value to choose red/green up/down arrows.","whyNot":{"b":"Background color shades the cell fill and would not add directional arrows.","c":"Font color changes the text color only; it produces no arrow icons.","d":"Data bars draw proportional bars in the cell rather than status arrows."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-conditional-table-formatting","tags":["conditional-formatting","icons"]},{"id":"viz-rep-0006","domain":"visualize","objective":"Create reports","subObjective":"Configure filter scope","type":"single","difficulty":1,"stem":"A report has three pages. You add a filter on **Fiscal Year = 2025** to the *Filters on this page* section of the Overview page only. The Detail and Trends pages must remain unaffected.\n\nWhat is the effect of this configuration?","options":[{"id":"a","text":"Only visuals on the Overview page are filtered to Fiscal Year 2025; the other pages are unaffected."},{"id":"b","text":"All visuals on all three pages are filtered to Fiscal Year 2025."},{"id":"c","text":"Only the single selected visual on the Overview page is filtered."},{"id":"d","text":"No visuals are filtered until you also add the field to each visual."}],"correct":["a"],"explanation":{"why":"A filter placed in the *Filters on this page* bucket applies to every visual on that one page only, so just the Overview page is filtered to 2025.","whyNot":{"b":"A report-level filter (Filters on all pages) would affect all pages; a page-level filter does not.","c":"A visual-level filter (Filters on this visual) affects a single visual; the page-level scope affects the whole page.","d":"Page-level filters take effect immediately across the page without adding the field to each visual."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-report-filter-types","tags":["filters","filter-scope"]},{"id":"viz-rep-0007","domain":"visualize","objective":"Create reports","subObjective":"Configure filter scope","type":"dragdrop","difficulty":3,"stem":"Match each filtering requirement to the correct filter scope by selecting the option that lists the correct pairings.\n\nRequirements:\n1. A currency filter that must apply to every visual on every page of the report.\n2. A filter that must apply only to the visuals on the Sales page.\n3. A filter that must restrict only one specific matrix visual.\n\nScopes available: Filters on all pages, Filters on this page, Filters on this visual.","options":[{"id":"a","text":"1 → Filters on all pages; 2 → Filters on this page; 3 → Filters on this visual"},{"id":"b","text":"1 → Filters on this page; 2 → Filters on all pages; 3 → Filters on this visual"},{"id":"c","text":"1 → Filters on this visual; 2 → Filters on this page; 3 → Filters on all pages"},{"id":"d","text":"1 → Filters on all pages; 2 → Filters on this visual; 3 → Filters on this page"}],"correct":["a"],"explanation":{"why":"Report-level filters (Filters on all pages) span the entire report, page-level filters (Filters on this page) affect a single page, and visual-level filters (Filters on this visual) restrict one visual only. Option A maps each requirement to the matching scope.","whyNot":{"b":"It swaps the report-wide and page-only requirements, so the currency filter would not reach all pages.","c":"It inverts report and visual scopes, applying the report-wide filter to a single visual and vice versa.","d":"It assigns the page requirement to a single visual and the single-visual requirement to the whole page."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-report-filter-types","tags":["filters","filter-scope","dragdrop"]},{"id":"viz-rep-0008","domain":"visualize","objective":"Create reports","subObjective":"Apply and customize themes","type":"single","difficulty":1,"stem":"Your organization requires all reports to use a standard set of corporate colors, fonts, and default visual styles. You want to apply these consistently across an entire report in one step and reuse the definition in future reports.\n\nWhat should you do in Power BI Desktop?","options":[{"id":"a","text":"Import a custom report theme (JSON file)"},{"id":"b","text":"Manually set the colors on each visual using the Format pane"},{"id":"c","text":"Change the page background image"},{"id":"d","text":"Turn on high-contrast mode in Windows"}],"correct":["a"],"explanation":{"why":"A report theme, defined in a JSON file, sets colors, fonts, and default formatting across the whole report at once and can be imported into other reports for consistency.","whyNot":{"b":"Formatting each visual manually is inconsistent, time consuming, and not reusable across reports.","c":"A background image changes only the page canvas appearance, not the color palette or default visual styles.","d":"Windows high-contrast mode is an OS accessibility setting and does not define corporate report styling."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-report-themes","tags":["themes","formatting"]},{"id":"viz-rep-0009","domain":"visualize","objective":"Create reports","subObjective":"Design for accessibility","type":"multi","difficulty":2,"stem":"You are making a report accessible to users who rely on screen readers and to users with color-vision deficiency.\n\nWhich **two** actions directly improve accessibility? Select two.","options":[{"id":"a","text":"Set the tab order of visuals in the Selection pane so screen readers read them in a logical sequence"},{"id":"b","text":"Add alt text to each visual describing its purpose and key insight"},{"id":"c","text":"Rely solely on color to distinguish series in every chart"},{"id":"d","text":"Remove all titles from visuals to reduce clutter"},{"id":"e","text":"Use a smaller font size everywhere to fit more visuals"}],"correct":["a","b"],"explanation":{"why":"Setting a logical tab order ensures screen readers traverse visuals in a meaningful sequence, and alt text gives assistive technology a spoken description of each visual. Both are recommended accessibility practices.","whyNot":{"c":"Relying solely on color excludes users with color-vision deficiency; you should add markers, labels, or patterns in addition to color.","d":"Removing titles removes context that screen readers and all users depend on, reducing accessibility.","e":"Very small fonts reduce legibility for users with low vision and harm accessibility."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-accessibility-overview","tags":["accessibility","multi"]},{"id":"viz-rep-0010","domain":"visualize","objective":"Create reports","subObjective":"Design for accessibility","type":"single","difficulty":1,"stem":"A stakeholder using a screen reader opens your report and cannot understand what a particular chart represents because the reader announces only \"chart\".\n\nWhat single change best resolves this?","options":[{"id":"a","text":"Add descriptive alt text to the visual"},{"id":"b","text":"Increase the visual's size"},{"id":"c","text":"Change the visual's background color"},{"id":"d","text":"Pin the visual to a dashboard"}],"correct":["a"],"explanation":{"why":"Alt text provides a text description that screen readers announce, giving non-sighted users the meaning and key takeaway of the visual.","whyNot":{"b":"Enlarging the visual does not give a screen reader any descriptive information.","c":"Background color has no effect on what a screen reader announces.","d":"Pinning to a dashboard changes where the visual appears but does not add a spoken description."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-accessibility-creating-reports","tags":["accessibility","alt-text"]},{"id":"viz-rep-0011","domain":"visualize","objective":"Create reports","subObjective":"Create a paginated report","type":"single","difficulty":2,"stem":"The finance team needs a **pixel-perfect, multi-page invoice document** that can be exported to PDF and printed, with precise control over page breaks and a repeating header on every printed page.\n\nWhich Power BI tool should you use to build this?","options":[{"id":"a","text":"Power BI Report Builder (paginated report)"},{"id":"b","text":"Power BI Desktop (interactive report)"},{"id":"c","text":"Power BI dashboard in the service"},{"id":"d","text":"Power Query Editor"}],"correct":["a"],"explanation":{"why":"Paginated reports, authored in Power BI Report Builder, are designed for pixel-perfect, print-ready documents that paginate across many pages with controllable page breaks and repeating headers, ideal for invoices.","whyNot":{"b":"Power BI Desktop produces interactive, screen-oriented reports that are not optimized for precise multi-page print layouts.","c":"A dashboard is a single-page collection of pinned tiles in the service, not a printable multi-page document.","d":"Power Query Editor is for transforming data, not for designing report layouts."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/paginated-reports/paginated-reports-report-builder-power-bi","tags":["paginated-report","report-builder"]},{"id":"viz-rep-0012","domain":"visualize","objective":"Create reports","subObjective":"Configure slicers","type":"single","difficulty":1,"stem":"Report users need to filter a page by selecting a **continuous date range** (a start and end date) using a draggable control.\n\nWhich slicer configuration should you use?","options":[{"id":"a","text":"A slicer on a date field set to the Between (range) slider style"},{"id":"b","text":"A slicer set to the List style"},{"id":"c","text":"A slicer set to the Dropdown style"},{"id":"d","text":"A card visual showing the max date"}],"correct":["a"],"explanation":{"why":"When a slicer is placed on a date/numeric field, Power BI offers a Between range slider that lets users drag handles to pick a start and end value, which is exactly a continuous date range control.","whyNot":{"b":"The List style shows discrete selectable items and does not present a draggable range slider.","c":"The Dropdown style also lists discrete items in a collapsed menu, not a continuous range.","d":"A card only displays a value and cannot be used to filter by a range."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-slicers","tags":["slicers","date-range"]},{"id":"viz-rep-0013","domain":"visualize","objective":"Create reports","subObjective":"Format and configure visuals","type":"single","difficulty":3,"stem":"A column chart plots monthly sales. Stakeholders want a **constant reference line at the 100,000 sales target** so months above and below the goal are obvious, and the line must automatically appear on top of the columns.\n\nWhere in Power BI Desktop do you add this?","options":[{"id":"a","text":"In the Analytics pane of the visual, add a Constant line at 100,000"},{"id":"b","text":"In the Filters pane, add a filter for values above 100,000"},{"id":"c","text":"In Power Query, add a custom column equal to 100,000"},{"id":"d","text":"In the Format pane, change the data colors to highlight high values"}],"correct":["a"],"explanation":{"why":"The Analytics pane lets you add reference lines such as a Constant line at a fixed value (100,000), which renders across the plot area on top of the columns.","whyNot":{"b":"A filter would remove months below the target rather than draw a reference line.","c":"A Power Query column adds data but does not create a visual reference line on the chart.","d":"Changing data colors highlights columns but does not create a fixed horizontal target line."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-add-analytics","tags":["formatting","analytics-pane","reference-line"]},{"id":"viz-enh-0014","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Configure bookmarks","type":"single","difficulty":2,"stem":"You want a single report page to toggle between a **chart view** and a **table view** of the same data when the user clicks a button, without navigating to another page.\n\nWhich features should you combine?","options":[{"id":"a","text":"Two bookmarks (one showing the chart, one showing the table) with the Selection pane used to hide/show each visual, wired to buttons"},{"id":"b","text":"Two separate report pages linked by page navigation only"},{"id":"c","text":"A drillthrough page for each visual"},{"id":"d","text":"Sync slicers across the pages"}],"correct":["a"],"explanation":{"why":"Bookmarks capture the visibility state set in the Selection pane. By creating one bookmark that shows the chart and hides the table, and another that reverses it, then assigning each to a button, users toggle views on one page.","whyNot":{"b":"Page navigation moves between pages; the requirement is to swap views on the same page.","c":"Drillthrough passes context to a detail page and is not a mechanism for toggling visuals in place.","d":"Sync slicers keep slicer selections consistent across pages and do not show or hide visuals."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-bookmarks","tags":["bookmarks","selection-pane"]},{"id":"viz-enh-0015","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Design custom tooltips","type":"single","difficulty":2,"stem":"When a user hovers over a bar in the Sales by Region chart, you want a rich pop-up showing a mini trend line and two KPIs specific to that region, instead of the default single-value tooltip.\n\nWhat should you create?","options":[{"id":"a","text":"A report-page tooltip (a page set as a Tooltip) and assign it to the visual's Tooltip setting"},{"id":"b","text":"A drillthrough page"},{"id":"c","text":"A bookmark that shows the KPIs"},{"id":"d","text":"A Q&A visual"}],"correct":["a"],"explanation":{"why":"A report-page tooltip lets you design a full mini-page of visuals that appears on hover, filtered to the data point being pointed at, enabling a trend line and KPIs in the tooltip.","whyNot":{"b":"Drillthrough requires a right-click action to navigate to a detail page; it does not appear on hover as a tooltip.","c":"A bookmark captures a saved state but is not shown automatically on hover over a data point.","d":"A Q&A visual answers natural-language questions and is unrelated to hover tooltips."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-tooltips","tags":["tooltips","custom-tooltip"]},{"id":"viz-enh-0016","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Edit interactions between visuals","type":"single","difficulty":2,"stem":"On a page with a slicer, a column chart, and a matrix, selecting a bar in the column chart currently cross-highlights the matrix. The stakeholders want a click on the column chart to **have no effect** on the matrix, while still cross-highlighting other visuals.\n\nWhat should you configure?","options":[{"id":"a","text":"Use Edit interactions and set the matrix's interaction from the column chart to None"},{"id":"b","text":"Delete the relationship between the two tables"},{"id":"c","text":"Add a visual-level filter to the matrix"},{"id":"d","text":"Turn off Cross-report drillthrough"}],"correct":["a"],"explanation":{"why":"Edit interactions lets you control, per source-target pair, whether a selection filters, highlights, or does nothing. Setting the matrix to None for the column chart source stops that specific interaction while leaving others intact.","whyNot":{"b":"Deleting the model relationship would break data across the whole report, not just one interaction.","c":"A visual-level filter statically restricts the matrix data; it does not stop click-driven cross-highlighting.","d":"Cross-report drillthrough concerns navigation between reports, not intra-page cross-highlighting."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/service-reports-visual-interactions","tags":["interactions","cross-highlight"]},{"id":"viz-enh-0017","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Configure navigation","type":"single","difficulty":1,"stem":"You want a set of buttons on the report's home page that each jump directly to a specific page (Overview, Sales, Inventory) when clicked in the Power BI service.\n\nWhat is the simplest built-in way to configure these buttons?","options":[{"id":"a","text":"Add buttons and set each button's Action type to Page navigation, choosing the destination page"},{"id":"b","text":"Add buttons with a Back action"},{"id":"c","text":"Create a bookmark for each page and rely on the bookmark navigator only"},{"id":"d","text":"Use drillthrough from the home page to each page"}],"correct":["a"],"explanation":{"why":"Buttons support a Page navigation action where you pick the target page; clicking the button navigates there directly with no extra objects needed.","whyNot":{"b":"A Back action returns to the previously viewed page rather than jumping to a chosen page.","c":"Bookmarks capture states and could navigate, but the requirement is simple page-to-page jumps, for which Page navigation is the direct built-in action.","d":"Drillthrough passes filter context to a detail page and is not a general page-jump menu."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-page-navigation","tags":["navigation","buttons"]},{"id":"viz-enh-0018","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Sync slicers across pages","type":"single","difficulty":3,"stem":"A report has a Region slicer on the Sales page. You need the **same Region selection to automatically apply on the Inventory page**, but you do not want the slicer control itself to be visible on the Inventory page.\n\nWhat should you configure in the Sync slicers pane?","options":[{"id":"a","text":"Enable Sync for the Inventory page but leave the Visible checkbox for that page unchecked"},{"id":"b","text":"Enable both Sync and Visible for the Inventory page"},{"id":"c","text":"Copy and paste the slicer onto the Inventory page without syncing"},{"id":"d","text":"Set a report-level filter on Region and remove the slicer"}],"correct":["a"],"explanation":{"why":"In the Sync slicers pane each page has separate Sync and Visible checkboxes. Checking Sync (without Visible) applies the selection to that page while hiding the slicer control there.","whyNot":{"b":"Enabling Visible as well would show the slicer control on the Inventory page, which the requirement forbids.","c":"A pasted, unsynced slicer maintains its own independent selection and would not follow the Sales page.","d":"A report-level filter is static and cannot be changed interactively like the synced slicer selection."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-slicers#sync-and-use-slicers-on-other-pages","tags":["slicers","sync-slicers"]},{"id":"viz-enh-0019","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Use the Selection pane, grouping, and layering","type":"single","difficulty":1,"stem":"You have overlapping visuals used for a bookmark toggle, and you need to control which visual sits **in front** and to hide specific visuals for each bookmark state.\n\nWhich pane provides layer order (z-order) control and per-visual visibility toggles?","options":[{"id":"a","text":"Selection pane"},{"id":"b","text":"Fields pane"},{"id":"c","text":"Filters pane"},{"id":"d","text":"Visualizations pane"}],"correct":["a"],"explanation":{"why":"The Selection pane lists all objects on the page, lets you show or hide each one, group them, and reorder their layer (z-order), which is exactly what is needed for overlapping bookmark toggles.","whyNot":{"b":"The Fields pane lists data model tables and columns, not page objects or their layer order.","c":"The Filters pane manages filters, not visibility or z-order of visuals.","d":"The Visualizations pane is used to pick visual types and format them, not to manage show/hide and layering of all objects on the page."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-selection-pane","tags":["selection-pane","layering"]},{"id":"viz-enh-0020","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Configure drillthrough and drill down","type":"single","difficulty":2,"stem":"From a summary page, a user should be able to **right-click a specific customer** in a chart and jump to a detail page that is automatically filtered to that customer.\n\nWhat must you set up on the detail page?","options":[{"id":"a","text":"Add the Customer field to the Drill through well of the detail page"},{"id":"b","text":"Enable drill down on the summary chart"},{"id":"c","text":"Add a Customer slicer synced across pages"},{"id":"d","text":"Add the Customer field to the Tooltip fields of the summary chart"}],"correct":["a"],"explanation":{"why":"Drillthrough is configured by dragging the target field (Customer) into the Drill through well on the destination page. Users can then right-click a customer on any page and drill through to the detail page filtered to that customer.","whyNot":{"b":"Drill down expands hierarchy levels within the same visual; it does not navigate to a filtered detail page.","c":"A synced slicer keeps selections consistent but does not create the right-click drillthrough navigation to a context-filtered page.","d":"Adding a field to Tooltip fields affects hover tooltips, not drillthrough navigation."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-drillthrough","tags":["drillthrough","navigation"]},{"id":"viz-enh-0021","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Configure personalized visuals","type":"single","difficulty":3,"stem":"Business users want to **change a chart's measure and axis field themselves** while viewing a published report in the Power BI service, without editing the report, and optionally save their changes as a personal bookmark.\n\nWhat must the report author enable?","options":[{"id":"a","text":"The Personalize visuals report setting in Power BI Desktop (Report settings)"},{"id":"b","text":"Row-level security roles"},{"id":"c","text":"Q&A for the dataset"},{"id":"d","text":"Scheduled refresh on the dataset"}],"correct":["a"],"explanation":{"why":"The Personalize visuals feature, enabled in the report's settings, lets consumers change fields, measures, aggregation, and visual type on the fly and save those changes as personal bookmarks, without modifying the published report for others.","whyNot":{"b":"Row-level security restricts which rows a user can see; it does not let users reshape visuals.","c":"Q&A answers natural-language questions but does not let users personalize an existing visual's fields.","d":"Scheduled refresh updates data and has nothing to do with letting users personalize visuals."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-personalize-visuals","tags":["personalize-visuals","self-service"]},{"id":"viz-enh-0022","domain":"visualize","objective":"Enhance reports for usability and storytelling","subObjective":"Configure bookmarks and navigation","type":"hotspot","difficulty":2,"stem":"You designed five bookmarks representing different filter states and want to give users a ready-made set of navigation arrows to step through them without manually creating one button per bookmark.\n\nFrom the choices below (imagine clicking the correct control on the ribbon/Insert menu), which control should you insert?","options":[{"id":"a","text":"Insert > Buttons > Navigator > Bookmark navigator"},{"id":"b","text":"Insert > Buttons > Blank, then manually assign each bookmark"},{"id":"c","text":"Insert > Text box for each bookmark name"},{"id":"d","text":"Insert > Image and hyperlink each one"}],"correct":["a"],"explanation":{"why":"The Bookmark navigator is a built-in navigator control that automatically generates a set of linked buttons for the report's bookmarks, updating as bookmarks are added or removed.","whyNot":{"b":"Manually assigning bookmarks to blank buttons works but is exactly the tedious approach the requirement wants to avoid.","c":"Text boxes only display text and cannot trigger bookmark actions on their own as a navigator.","d":"Images with hyperlinks navigate to URLs, not through the report's bookmark set."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/button-navigators","tags":["bookmarks","navigation","hotspot"]},{"id":"viz-pat-0023","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Use the Analyze feature","type":"single","difficulty":2,"stem":"Total sales dropped sharply from May to June. You want Power BI to automatically explain **which categories contributed most to that decrease** by right-clicking the June data point.\n\nWhich feature should you use?","options":[{"id":"a","text":"Analyze > Explain the decrease"},{"id":"b","text":"Add a trend line in the Analytics pane"},{"id":"c","text":"Create a forecast"},{"id":"d","text":"Apply Top N filter"}],"correct":["a"],"explanation":{"why":"The Analyze feature's Explain the increase/decrease option runs automated insights on a selected data point and surfaces the categories that most drove the change, delivered as auto-generated visuals.","whyNot":{"b":"A trend line summarizes overall direction but does not attribute a specific change to contributing categories.","c":"A forecast projects future values; it does not explain a past drop.","d":"A Top N filter limits which items are shown; it does not analyze the drivers of a change."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-insights","tags":["analyze","insights"]},{"id":"viz-pat-0024","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Apply grouping, binning, and clustering","type":"single","difficulty":2,"stem":"A histogram-style analysis requires grouping a continuous **Unit Price** field into equal-width buckets of 10 dollars so you can count how many products fall in each price band.\n\nWhat should you create in Power BI Desktop?","options":[{"id":"a","text":"A bin (group) on Unit Price with bin size 10"},{"id":"b","text":"A calculated column with RANKX"},{"id":"c","text":"A measure using AVERAGE"},{"id":"d","text":"A what-if parameter"}],"correct":["a"],"explanation":{"why":"Binning creates equal-width groups on a numeric or date field. Setting a bin size of 10 on Unit Price produces the 10-dollar bands needed for a histogram of product counts.","whyNot":{"b":"RANKX ranks rows; it does not bucket a continuous field into equal-width bands.","c":"An AVERAGE measure computes a single statistic, not price bands.","d":"A what-if parameter creates a slicer-driven variable, not fixed value bins for grouping."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-grouping-and-binning","tags":["binning","grouping"]},{"id":"viz-pat-0025","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Use AI visuals","type":"single","difficulty":2,"stem":"Executives want to type plain-English questions such as \"total sales by region last year\" directly on a report page and get a visual answer instantly.\n\nWhich AI visual should you add?","options":[{"id":"a","text":"Q&A visual"},{"id":"b","text":"Key influencers visual"},{"id":"c","text":"Decomposition tree visual"},{"id":"d","text":"Smart narrative visual"}],"correct":["a"],"explanation":{"why":"The Q&A visual accepts natural-language questions and generates an appropriate visual answer from the model, which matches the plain-English query requirement.","whyNot":{"b":"Key influencers explains what factors drive a metric; it does not answer free-form typed questions.","c":"The decomposition tree lets users interactively break a measure down by dimensions but is not a natural-language query box.","d":"Smart narrative generates written text summaries, not on-demand answers to typed questions."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-q-and-a","tags":["ai-visuals","q-and-a"]},{"id":"viz-pat-0026","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Use AI visuals","type":"single","difficulty":2,"stem":"An analyst wants to understand **which factors most increase the likelihood that a customer churns** and see the relative impact of each factor on that outcome.\n\nWhich AI visual is designed for this?","options":[{"id":"a","text":"Key influencers visual"},{"id":"b","text":"Q&A visual"},{"id":"c","text":"Gauge visual"},{"id":"d","text":"Smart narrative visual"}],"correct":["a"],"explanation":{"why":"The Key influencers visual analyzes data to reveal which factors most affect a chosen metric or outcome (such as churn) and ranks their relative influence, which is precisely the requirement.","whyNot":{"b":"Q&A answers typed questions but does not rank drivers of an outcome.","c":"A gauge shows progress toward a target and performs no driver analysis.","d":"Smart narrative writes descriptive text summaries rather than quantifying influence of factors."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-influencers","tags":["ai-visuals","key-influencers"]},{"id":"viz-pat-0027","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Use AI visuals","type":"single","difficulty":3,"stem":"A manager wants to interactively **drill into total revenue and, at each level, automatically expand into the dimension that contributes the highest value** (for example, revenue then region then product), following the largest contributor down the tree.\n\nWhich AI visual supports this, including an AI \"High value\" split?","options":[{"id":"a","text":"Decomposition tree visual"},{"id":"b","text":"Key influencers visual"},{"id":"c","text":"Line and clustered column chart"},{"id":"d","text":"Ribbon chart"}],"correct":["a"],"explanation":{"why":"The decomposition tree lets users break down a measure across dimensions in any order and includes AI splits such as High value, which automatically expands into the dimension with the highest contribution at each level.","whyNot":{"b":"Key influencers ranks factors affecting a metric but does not provide an interactive drill-down tree.","c":"A line and clustered column chart compares values but offers no AI-driven high-value drill path.","d":"A ribbon chart shows rank changes over time, not an interactive contribution tree."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-decomposition-tree","tags":["ai-visuals","decomposition-tree"]},{"id":"viz-pat-0028","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Use AI visuals","type":"dropdown","difficulty":2,"stem":"A report author wants an **automatically written, dynamic text summary** of the key takeaways on a page (highest values, trends) that updates as filters change.\n\nComplete the sentence: To add this, insert the **[ ... ]** visual.","options":[{"id":"a","text":"Smart narrative"},{"id":"b","text":"Decomposition tree"},{"id":"c","text":"Key influencers"},{"id":"d","text":"Q&A"}],"correct":["a"],"explanation":{"why":"The Smart narrative visual generates dynamic, natural-language text summarizing insights from the page or visual, and it refreshes as users filter and cross-highlight.","whyNot":{"b":"The decomposition tree is an interactive drill-down visual, not a written summary.","c":"Key influencers ranks drivers of a metric rather than producing narrative text.","d":"Q&A responds to typed questions with a visual and does not auto-generate a text summary of the page."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-smart-narrative","tags":["ai-visuals","smart-narrative","dropdown"]},{"id":"viz-pat-0029","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Configure forecasting and anomaly detection","type":"single","difficulty":3,"stem":"A line chart shows daily website visits over two years on a continuous date axis. Leadership wants Power BI to **project the next 30 days of visits with a confidence band**.\n\nWhat should you add, and what is a prerequisite?","options":[{"id":"a","text":"Add a Forecast in the Analytics pane; the line chart must use a single measure over a continuous time axis"},{"id":"b","text":"Add a Constant line in the Analytics pane"},{"id":"c","text":"Add a Trend line, which will project future values automatically"},{"id":"d","text":"Enable anomaly detection, which forecasts future points"}],"correct":["a"],"explanation":{"why":"The Forecast option in the Analytics pane predicts future values with an adjustable confidence interval. It requires a line chart with a single value plotted against a continuous (date/time or numeric) axis.","whyNot":{"b":"A constant line draws a fixed reference value and makes no prediction.","c":"A trend line summarizes the historical direction only; it does not produce a forecast with a confidence band.","d":"Anomaly detection flags unexpected past points; it does not project future values."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-add-analytics","tags":["forecasting","analytics-pane"]},{"id":"viz-pat-0030","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Configure forecasting and anomaly detection","type":"single","difficulty":3,"stem":"On a line chart of daily revenue, occasional unexpected spikes and dips appear. Stakeholders want Power BI to **automatically flag these unusual points and offer possible explanations** for each.\n\nWhich built-in capability should you enable?","options":[{"id":"a","text":"Anomaly detection on the line chart"},{"id":"b","text":"Forecast in the Analytics pane"},{"id":"c","text":"Clustering on a scatter chart"},{"id":"d","text":"Min and Max reference lines"}],"correct":["a"],"explanation":{"why":"Anomaly detection automatically identifies data points that fall outside the expected range on a time-series line chart and surfaces possible explanations for each detected anomaly.","whyNot":{"b":"Forecasting predicts future values but does not flag anomalous historical points.","c":"Clustering groups similar items on a scatter chart; it does not detect time-series anomalies.","d":"Min and Max reference lines merely mark extremes and provide no automated anomaly explanations."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-anomaly-detection","tags":["anomaly-detection","time-series"]},{"id":"viz-pat-0031","domain":"visualize","objective":"Identify patterns and trends","subObjective":"Create quick measures","type":"multi","difficulty":2,"stem":"An analyst without strong DAX skills needs a **month-over-month running total** and a **year-to-date total** for sales. They want Power BI to generate the DAX automatically through a guided dialog.\n\nWhich statements are correct? Select two.","options":[{"id":"a","text":"Quick measures provide a guided dialog that generates the DAX for calculations such as running total and year-to-date."},{"id":"b","text":"The DAX generated by a quick measure can be viewed and reused to learn DAX patterns."},{"id":"c","text":"Quick measures can only be created by editing the model in Power Query."},{"id":"d","text":"Quick measures require a paginated report license."},{"id":"e","text":"Quick measures cannot perform time-intelligence calculations."}],"correct":["a","b"],"explanation":{"why":"Quick measures offer a guided, menu-driven way to build common calculations (including running totals and time-intelligence such as year-to-date) and automatically write the underlying DAX, which the author can inspect and learn from.","whyNot":{"c":"Quick measures are created in the report/model view via the Quick measure dialog, not in Power Query.","d":"Quick measures are a standard Power BI Desktop feature and need no paginated report license.","e":"Quick measures include time-intelligence calculations such as year-to-date and month-over-month, so this is false."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-quick-measures","tags":["quick-measures","dax","multi"]},{"id":"mng-wsp-0001","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure workspace roles","type":"single","difficulty":1,"stem":"You manage a Power BI workspace named **Sales Analytics**. A new team member, Dana, must be able to publish reports, create and edit semantic models, and schedule refresh in the workspace. Dana must **not** be able to add or remove other users from the workspace.\n\nWhich workspace role should you assign to Dana?","options":[{"id":"a","text":"Admin"},{"id":"b","text":"Member"},{"id":"c","text":"Contributor"},{"id":"d","text":"Viewer"}],"correct":["c"],"explanation":{"why":"The Contributor role lets a user publish, edit, and delete content and manage scheduled refresh, but it cannot manage workspace access (add or remove users or change roles). This matches Dana's requirements exactly.","whyNot":{"a":"Admin can do everything Contributor can, but it can also manage workspace access and delete the workspace, which exceeds what Dana should be allowed to do.","b":"Member can publish and edit content but can also add other users (up to Member/Contributor/Viewer) and reshare, so it grants access-management ability that Dana must not have.","d":"Viewer is read-only. It cannot publish reports, edit semantic models, or configure scheduled refresh, so Dana could not perform the required tasks."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-roles-new-workspaces","tags":["workspace","roles","contributor"]},{"id":"mng-wsp-0002","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Publish and manage workspace apps","type":"single","difficulty":2,"stem":"Your team develops reports in a workspace and distributes a **Power BI app** to 400 business users. After several development changes, you update reports and add a new report to the workspace. Business users report that they still see the old content in the app.\n\nWhat must you do so users receive the latest content through the app?","options":[{"id":"a","text":"Add each business user to the workspace as a Viewer."},{"id":"b","text":"Select **Update app** and republish the app, including the new report in the app's content list."},{"id":"c","text":"Ask each user to refresh their browser and clear the cache."},{"id":"d","text":"Turn on scheduled refresh for the new report's semantic model."}],"correct":["b"],"explanation":{"why":"Changes made in a workspace are not automatically pushed to an already-published app. You must select Update app and republish so the new report is included in the app content and the updated versions are delivered to app consumers.","whyNot":{"a":"Adding users to the workspace bypasses the app-distribution model and gives them workspace access, but it does not update the published app that the 400 users consume.","c":"A browser refresh does not pull unpublished workspace changes into the app; the app must be updated and republished first.","d":"Scheduled refresh updates data in the semantic model. It does not publish new report content or structural changes to the app."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-create-distribute-apps","tags":["app","publish","update-app"]},{"id":"mng-wsp-0003","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure subscriptions","type":"single","difficulty":2,"stem":"A regional manager wants to automatically receive a snapshot of a specific report page in her inbox every Monday at 07:00, without opening the Power BI service.\n\nWhich feature should you configure to meet this requirement?","options":[{"id":"a","text":"A data alert on a dashboard tile."},{"id":"b","text":"An email subscription to the report page."},{"id":"c","text":"A scheduled refresh on the semantic model."},{"id":"d","text":"A shared link to the report with the reshare option enabled."}],"correct":["b"],"explanation":{"why":"Subscriptions let a user schedule an email that contains a snapshot of a specific report page (or dashboard) on a recurring schedule, delivered automatically without opening the service. This matches the Monday 07:00 delivery requirement.","whyNot":{"a":"Data alerts notify a user only when a tile value crosses a defined threshold; they are event-driven, not a fixed weekly delivery of a page snapshot.","c":"Scheduled refresh updates the data behind a report on a schedule. It does not email a report snapshot to a user.","d":"A shared link grants access to open the report interactively; it does not push a scheduled snapshot to the manager's inbox."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/end-user-subscribe","tags":["subscription","email","distribution"]},{"id":"mng-wsp-0004","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure data alerts","type":"single","difficulty":2,"stem":"You want to be notified in the Power BI service and by email whenever total daily orders fall below 500. You have a report visual that shows total daily orders.\n\nWhat must you do before you can create a **data alert** for this metric?","options":[{"id":"a","text":"Pin the visual as a card, gauge, or KPI tile to a dashboard, then set the alert on the tile."},{"id":"b","text":"Set the alert directly on the report visual in the report canvas."},{"id":"c","text":"Create a paginated report and set the alert on a table cell."},{"id":"d","text":"Enable row-level security on the semantic model."}],"correct":["a"],"explanation":{"why":"Data alerts are configured on dashboard tiles that are numeric card, gauge, or KPI visuals. You must first pin the visual to a dashboard as one of those tile types, then set the threshold alert on the tile.","whyNot":{"b":"Data alerts cannot be created directly on a report visual in the report canvas; they require a supported dashboard tile.","c":"Paginated reports do not support data alerts, and table cells are not a valid alert target.","d":"Row-level security controls which rows a user can see; it has no role in enabling or triggering data alerts."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/create-reports/service-set-data-alerts","tags":["data-alert","dashboard","kpi"]},{"id":"mng-wsp-0005","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Endorse content (promote and certify)","type":"multi","difficulty":2,"stem":"Your organization uses endorsement to help users find trusted content. You need to align your governance process with how endorsement works in Power BI.\n\nWhich **two** statements about endorsement are correct? Each correct answer presents a complete solution.","options":[{"id":"a","text":"Any workspace Contributor or higher can promote content they can edit."},{"id":"b","text":"Only users defined as authorized certifiers by a Fabric/Power BI administrator can certify content."},{"id":"c","text":"Certifying content automatically applies row-level security to it."},{"id":"d","text":"Promotion and certification are the two endorsement levels available for items such as semantic models and reports."},{"id":"e","text":"Endorsement encrypts the underlying data of the semantic model."}],"correct":["b","d"],"explanation":{"why":"Certification is restricted to users designated as authorized certifiers by an administrator, and the two endorsement levels are Promoted and Certified. Both statements accurately describe endorsement governance.","whyNot":{"a":"Promotion requires write permission on the item, but the ability to promote is tied to edit rights on the specific item; the statement overstates it as a blanket Contributor capability across all content and is not one of the two correct governance facts being tested. Certification, not promotion, is the administrator-gated level.","c":"Endorsement is a trust label. It does not apply or configure row-level security.","e":"Endorsement does not encrypt data. Data protection is handled by sensitivity labels and platform encryption, not endorsement."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-endorse-content","tags":["endorsement","certify","promote","governance"]},{"id":"mng-wsp-0006","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Configure scheduled refresh and gateways","type":"single","difficulty":3,"stem":"A semantic model published to the Power BI service imports data from an on-premises SQL Server database. You configure scheduled refresh, but the refresh fails with a message indicating that the data source cannot be reached.\n\nWhat is the most appropriate action to enable successful scheduled refresh?","options":[{"id":"a","text":"Install and configure an on-premises data gateway (standard mode) and map the SQL Server source to it in the semantic model's gateway settings."},{"id":"b","text":"Increase the scheduled refresh frequency to hourly."},{"id":"c","text":"Republish the report from Power BI Desktop using DirectQuery."},{"id":"d","text":"Assign the semantic model owner the Admin role in the workspace."}],"correct":["a"],"explanation":{"why":"Cloud-based scheduled refresh cannot reach an on-premises source directly. A standard on-premises data gateway provides the secure bridge; after installing it and binding the SQL Server data source to the gateway in the semantic model settings, scheduled refresh can succeed.","whyNot":{"b":"Changing the frequency does not solve connectivity; every refresh would still fail because the service cannot reach the on-premises source without a gateway.","c":"Switching to DirectQuery still requires a gateway for on-premises SQL Server, and it changes the storage model rather than fixing the refresh connectivity for an import model.","d":"Workspace roles govern content permissions, not network connectivity to an on-premises data source; changing the role does not enable refresh."}},"sourceUrl":"https://learn.microsoft.com/en-us/power-bi/connect-data/service-gateway-onprem","tags":["scheduled-refresh","gateway","on-premises"]},{"id":"mng-wsp-0007","domain":"manage","objective":"Create and manage workspaces and items","subObjective":"Create and manage dashboards","type":"single","difficulty":1,"stem":"An executive wants a single-page canvas that combines the most important visuals from **three different reports** built on different semantic models into one at-a-glance view in the Power BI service.\n\nWhich item type should you create?","options":[{"id":"a","text":"A dashboard with tiles pinned from each report."},{"id":"b","text":"A single Power BI Desktop report page."},{"id":"c","text":"A paginated (.rdl) report."},{"id":"d","text":"A workspace app landing page."}],"correct":["a"],"explanation":{"why":"A dashboard is a single-page canvas in the Power BI service where you can pin tiles from multiple reports built on multiple semantic models, giving an at-a-glance combined view. This is exactly the described requir
