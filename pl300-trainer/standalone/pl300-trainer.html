      <div class="eyebrow">Domain</div>
      <div class="row" style="margin:8px 0 18px">
        ${["all",...DOMAINS].map(d=>`<button class="pill ${st.domain===d?'amber':''}" data-act="sdom" data-d="${d}" style="cursor:pointer">${d==="all"?"All domains":DLABEL[d]}</button>`).join("")}
      </div>
      <div class="eyebrow">Questions: <span id="ssz">${st.size}</span></div>
      <input type="range" min="5" max="40" step="5" value="${st.size}" data-act="ssize" style="margin:8px 0 20px">
      <button class="btn block dark-ink" data-act="sstart">Start studying</button>
    </div>`;return;
  }
  if(st.stage==="done"){
    const pct=st.list.length?Math.round(st.correct/st.list.length*100):0;
    app.innerHTML=`<div class="card">
      <h2>Session complete</h2>
      <div class="stat" style="margin:6px 0 14px"><div class="eyebrow">Score</div>
        <div class="n">${st.correct}/${st.list.length} <span style="font-size:16px;font-weight:500;color:var(--ink-soft)">(${pct}%)</span></div>
        <div class="bar" style="margin-top:10px"><span class="${pct>=70?'good':''}" style="width:${pct}%"></span></div></div>
      <div class="row"><button class="btn dark-ink" data-act="sagain">New session</button>
      <button class="btn ghost" data-go="home">Home</button></div>
    </div>`;return;
  }
  const q=st.list[st.i], a=st.ans[q.id];
  app.innerHTML=`
    <div class="row" style="margin-bottom:12px"><div class="bar" style="flex:1"><span style="width:${(st.i+1)/st.list.length*100}%"></span></div>
      <span class="sub mono">${st.i+1}/${st.list.length}</span></div>
    ${q.caseStudyId?caseBanner(q):""}
    <div class="card">${questionBlock(q,st.i,st.list.length,{selected:a.sel,revealed:a.rev,flagged:false,flagBtn:false})}</div>
    <div class="row" style="margin-top:14px">
      ${a.rev?`<span class="pill ${eqSet(q.correct,a.sel)?'good':'bad'}">${eqSet(q.correct,a.sel)?"Correct":"Incorrect"}</span>`:""}
      <div class="spread">
        ${a.rev?`<button class="btn dark-ink" data-act="snext">${st.i>=st.list.length-1?"Finish":"Next"}</button>`
              :`<button class="btn dark-ink" data-act="scheck" ${a.sel.length?"":"disabled"}>Check answer</button>`}
      </div>
    </div>`;
}
function caseBanner(q){const c=CS.find(x=>x.id===q.caseStudyId);if(!c)return"";
  return `<div class="card" style="border-color:color-mix(in srgb,var(--blue) 40%,var(--line));margin-bottom:14px">
    <div class="row" style="margin-bottom:6px"><span class="pill blue">Case study</span><strong>${esc(c.title)}</strong></div>
    <div class="md" style="font-size:13.5px">${md(c.scenario)}</div></div>`;}

/* ================= EXAM ================= */
function viewExam(){
  if(!S.exam)S.exam={stage:"setup",size:40,timed:true,caseStudy:true};
  const ex=S.exam;
  if(ex.stage==="setup"){
    const presets=[[15,20],[40,60],[Q.length,150]];
    app.innerHTML=`<div class="card">
      <h2>Exam simulator</h2>
      <div class="eyebrow">Form length</div>
      <div class="grid3" style="margin:8px 0 16px">
        ${presets.map(([n,m],idx)=>`<button class="tile ${ex.p===idx||(ex.p==null&&idx===1)?'':''}" data-act="epreset" data-i="${idx}" style="border-color:${(ex.p??1)===idx?'var(--accent)':'var(--line)'}">
          <strong>${["Quick check","Realistic","Full bank"][idx]}</strong><div class="sub">${n} questions · ${m} min</div></button>`).join("")}
      </div>
      <label class="row between" style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px">
        <span><strong style="font-size:14px">Timed</strong><div class="sub">Auto-submits when the clock runs out.</div></span>
        <input type="checkbox" data-act="etimed" ${ex.timed?"checked":""}></label>
      <label class="row between" style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px">
        <span><strong style="font-size:14px">Include case study</strong><div class="sub">A linked multi-question section.</div></span>
        <input type="checkbox" data-act="ecase" ${ex.caseStudy?"checked":""}></label>
      <div class="note" style="margin-bottom:16px">No feedback until you submit. Flag questions and jump around with the navigator.</div>
      <button class="btn block dark-ink" data-act="estart">Start exam</button>
    </div>`;return;
  }
  if(ex.stage==="report"){return examReport();}
  // running
  const q=ex.list[ex.i], a=ex.ans[q.id];
  const answered=ex.list.filter(x=>ex.ans[x.id].sel.length).length;
  const flags=ex.list.filter(x=>ex.ans[x.id].flag).length;
  const rem=ex.limit?Math.max(0,ex.start+ex.limit-Date.now()):null;
  app.innerHTML=`
    <div class="row" style="margin-bottom:14px">
      <span class="pill">${answered}/${ex.list.length} answered</span>
      ${flags?`<span class="pill amber">⚑ ${flags}</span>`:""}
      ${rem!=null?`<span class="timer ${rem<300000?'low':''} spread" id="timer">${fmt(rem)}</span>`:'<span class="spread"></span>'}
      <button class="btn ghost" data-act="egrid" style="padding:7px 12px">▦ Review</button>
    </div>
    ${ex.showGrid?examGrid():""}
    ${q.caseStudyId?caseBanner(q):""}
    <div class="card">${questionBlock(q,ex.i,ex.list.length,{selected:a.sel,revealed:false,flagged:a.flag,flagBtn:true})}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn subtle" data-act="eprev" ${ex.i===0?"disabled":""}>Back</button>
      <div class="spread">
        ${ex.i<ex.list.length-1?`<button class="btn dark-ink" data-act="enext">Next</button>`
          :`<button class="btn dark-ink" data-act="esubmit">Submit exam</button>`}
      </div>
    </div>
    ${ex.i===ex.list.length-1?"":`<div style="text-align:center;margin-top:12px"><button class="link" data-act="esubmit">Submit exam now</button></div>`}`;
  if(rem!=null)startTimer();
}
function examGrid(){const ex=S.exam;
  return `<div class="card" style="margin-bottom:14px"><div class="row between" style="margin-bottom:10px">
      <strong style="font-size:14px">Question navigator</strong><button class="link" data-act="egrid">Close</button></div>
    <div class="navgrid">${ex.list.map((q,idx)=>{const a=ex.ans[q.id];
      return `<button class="navcell ${a.sel.length?'ans':''} ${idx===ex.i?'cur':''}" data-act="ejump" data-i="${idx}">${idx+1}${a.flag?'<span class="fl">⚑</span>':""}</button>`;}).join("")}</div></div>`;}
let timerH=null;
function startTimer(){clearInterval(timerH);timerH=setInterval(()=>{
  const ex=S.exam;if(!ex||ex.stage!=="running"){clearInterval(timerH);return;}
  const rem=Math.max(0,ex.start+ex.limit-Date.now());const t=document.getElementById("timer");
  if(t){t.textContent=fmt(rem);t.classList.toggle("low",rem<300000);}
  if(rem<=0){clearInterval(timerH);doSubmit();}
},1000);}
function buildExam(){
  const ex=S.exam, presets=[15,40,Q.length], size=presets[ex.p??1];
  let csq=[];if(ex.caseStudy&&CS.length){csq=CS[0].questions.map(q=>({...q,caseStudyId:CS[0].id}));}
  const standalone=Q.filter(q=>!q.caseStudyId);
  const mid={};let sum=0;DOMAINS.forEach(d=>{mid[d]=(DWEIGHT[d][0]+DWEIGHT[d][1])/2;sum+=mid[d];});
  const csByD={};DOMAINS.forEach(d=>csByD[d]=csq.filter(q=>q.domain===d).length);
  const byD={};DOMAINS.forEach(d=>byD[d]=shuffle(standalone.filter(q=>q.domain===d)));
  let picked=[];
  DOMAINS.forEach(d=>{const want=Math.round(size*mid[d]/sum)-csByD[d];picked=picked.concat(byD[d].slice(0,Math.max(0,want)));});
  const rem=Math.max(0,size-csq.length);let pool=shuffle(standalone.filter(q=>!picked.includes(q)));
  while(picked.length<rem&&pool.length)picked.push(pool.pop());
  picked=picked.slice(0,rem);
  const list=shuffle(picked).concat(csq);
  ex.list=list;ex.ans={};list.forEach(q=>ex.ans[q.id]={sel:[],flag:false});
  ex.i=0;ex.start=Date.now();ex.limit=ex.timed?[20,60,150][ex.p??1]*60000:null;ex.stage="running";ex.showGrid=false;
}
function doSubmit(){
  const ex=S.exam;clearInterval(timerH);
  let correct=0;const byD={},byT={};
  ex.list.forEach(q=>{const ok=eqSet(q.correct,ex.ans[q.id].sel);if(ok)correct++;
    (byD[q.domain]=byD[q.domain]||{t:0,c:0}).t++;if(ok)byD[q.domain].c++;
    q.tags.forEach(tg=>{(byT[tg]=byT[tg]||{t:0,c:0}).t++;if(ok)byT[tg].c++;});});
  const acc=correct/ex.list.length, sc=scaled(acc);
  ex.report={correct,total:ex.list.length,acc,scaled:sc,passed:sc>=700,byD,byT};ex.stage="report";
  save("lastExam",{scaled:sc,passed:sc>=700,correct,total:ex.list.length});
  const hist=load("history",[]);hist.push({t:Date.now(),scaled:sc,passed:sc>=700});save("history",hist);
  toTop();render();
}
function examReport(){
  const r=S.exam.report;
  const tags=Object.entries(r.byT).map(([tag,v])=>({tag,acc:v.c/v.t,c:v.c,t:v.t})).sort((a,b)=>a.acc-b.acc).slice(0,14);
  app.innerHTML=`<div class="card">
    <div class="row between"><h2 style="margin:0">Score report</h2><span class="pill ${r.passed?'good':'bad'}">${r.passed?"PASS (est.)":"BELOW PASS (est.)"}</span></div>
    <div class="grid3" style="margin-top:16px">
      <div class="stat"><div class="eyebrow">Scaled score (est.)</div><div class="n" style="color:${r.passed?'var(--good)':'var(--bad)'}">${r.scaled}</div><div class="sub">pass ≥ 700 / 1000</div></div>
      <div class="stat"><div class="eyebrow">Raw accuracy</div><div class="n">${Math.round(r.acc*100)}%</div><div class="sub">${r.correct}/${r.total} correct</div></div>
      <div class="stat"><div class="eyebrow">Questions</div><div class="n">${r.total}</div><div class="sub">this form</div></div>
    </div>
    <div class="note" style="margin-top:14px">The scaled score is an <strong>estimate</strong> — Microsoft doesn't publish its curve (700 isn't a raw 70%). Use the breakdown below to target study.</div>
  </div>
  <div class="card"><h2>By domain</h2>
    ${DOMAINS.filter(d=>r.byD[d]).map(d=>{const v=r.byD[d];const p=Math.round(v.c/v.t*100);
      return `<div style="margin:10px 0"><div class="row between" style="font-size:14px"><span>${DLABEL[d]}</span><span class="sub">${v.c}/${v.t} (${p}%)</span></div>
      <div class="bar" style="margin-top:5px"><span class="${p>=70?'good':p>=50?'':'bad'}" style="width:${p}%"></span></div></div>`;}).join("")}
  </div>
  <div class="card"><h2>Weakest tags</h2><div class="row">
    ${tags.map(t=>{const p=Math.round(t.acc*100);return `<span class="pill ${p>=70?'good':p>=50?'amber':'bad'}">${esc(t.tag)} · ${p}%</span>`;}).join("")}</div></div>
  <div class="row" style="margin-top:16px">
    <button class="btn ghost" data-act="ereview">Review all questions</button>
    <button class="btn subtle" data-act="eagain">New exam</button>
    <button class="btn ghost" data-go="home">Home</button>
  </div>
  <div id="reviewList"></div>`;
}

/* ================= DRILLS ================= */
function viewDrills(){
  if(!S.dr)S.dr={tab:"flash",fi:0,flip:false,di:0,dsel:null,drev:false,src:"predictOutput"};
  const d=S.dr;
  const tabBtn=(k,l)=>`<button class="btn ${d.tab===k?'dark-ink':'subtle'}" data-act="dtab" data-k="${k}">${l}</button>`;
  let body="";
  if(d.tab==="flash"){
    const c=DR.flashcards[d.fi%DR.flashcards.length];
    body=`<div class="card flip" data-act="dflip">
      <span class="pill blue" style="align-self:center;margin-bottom:10px">${esc(c.group)}</span>
      ${d.flip?`<div class="md" style="text-align:left">${md(c.back)}</div>
        <div style="margin-top:10px;text-align:left"><a href="${esc(c.sourceUrl)}" target="_blank" rel="noreferrer">↗ Learn source</a></div>`
        :`<div style="font-size:20px;font-weight:700">${esc(c.front)}</div><div class="sub" style="margin-top:8px">click to reveal</div>`}
    </div>
    <div class="row" style="margin-top:14px"><span class="sub mono">${d.fi%DR.flashcards.length+1}/${DR.flashcards.length}</span>
      <button class="btn dark-ink spread" data-act="dfnext">Next card</button></div>`;
  } else {
    const list=d.tab==="predict"?DR.predictOutput:DR.contextDrills;
    const it=list[d.di%list.length];
    const right=d.drev&&d.dsel&&it.correct.includes(d.dsel);
    body=`<div class="card">
      <div class="exhibit"><div class="eyebrow" style="margin-bottom:6px">Model</div><div class="md" style="font-size:13.5px">${md(it.model)}</div></div>
      <div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:4px">Measure</div><div class="md" style="font-size:13.5px">${md(it.measure)}</div></div>
      <div style="font-weight:600;margin:12px 0 2px">${esc(it.question)}</div>
      ${it.options.map((o,idx)=>{let cls="opt";if(d.drev){if(it.correct.includes(o.id))cls+=" correct";else if(d.dsel===o.id)cls+=" wrong";}else if(d.dsel===o.id)cls+=" sel";
        return `<button class="${cls}" data-act="dpick" data-oid="${o.id}" ${d.drev?"disabled":""}><span class="key">${String.fromCharCode(65+idx)}</span><span class="md">${md(o.text)}</span></button>`;}).join("")}
      ${d.drev?`<div class="expl"><span class="pill ${right?'good':'bad'}">${right?"Correct":"Not quite"}</span>
        <div class="md" style="font-size:14px;margin-top:8px">${md(it.explanation)}</div>
        <div style="margin-top:8px"><a href="${esc(it.sourceUrl)}" target="_blank" rel="noreferrer">↗ Learn source</a></div></div>`:""}
    </div>
    <div class="row" style="margin-top:14px"><span class="sub mono">${d.di%list.length+1}/${list.length}</span>
      <div class="spread">${d.drev?`<button class="btn dark-ink" data-act="dnext">Next</button>`:`<button class="btn dark-ink" data-act="dcheck" ${d.dsel?"":"disabled"}>Check</button>`}</div></div>`;
  }
  app.innerHTML=`<div class="row" style="margin-bottom:16px">
    ${tabBtn("flash","DAX flashcards")}${tabBtn("predict","Predict the output")}${tabBtn("context","Row vs filter context")}</div>${body}`;
}

/* ================= handlers ================= */
function handle(act,ds,el){
  const st=S.study, ex=S.exam, d=S.dr;
  switch(act){
    // study
    case "sdom":st.domain=ds.d;render();break;
    case "ssize":st.size=+el.value;document.getElementById("ssz").textContent=el.value;break;
    case "sstart":{let pool=st.domain==="all"?Q:Q.filter(q=>q.domain===st.domain);
      st.list=shuffle(pool).slice(0,st.size);st.ans={};st.list.forEach(q=>st.ans[q.id]={sel:[],rev:false});
      st.i=0;st.correct=0;st.stage="study";render();break;}
    case "scheck":{const q=st.list[st.i];st.ans[q.id].rev=true;if(eqSet(q.correct,st.ans[q.id].sel))st.correct++;render();break;}
    case "snext":if(st.i>=st.list.length-1){st.stage="done";}else st.i++;render();break;
    case "sagain":S.study={stage:"setup",domain:st.domain,size:st.list.length};render();break;
    // shared pick (study)
    case "pick":{ // could be study or exam
      if(route==="study"){const q=st.list[st.i],a=st.ans[q.id];if(a.rev)break;togglePick(q,a,ds.oid);render();}
      else if(route==="exam"){const q=ex.list[ex.i],a=ex.ans[q.id];togglePick(q,a,ds.oid);render();}
      break;}
    case "flag":{const q=ex.list[ex.i];ex.ans[q.id].flag=!ex.ans[q.id].flag;render();break;}
    // exam
    case "epreset":ex.p=+ds.i;render();break;
    case "etimed":ex.timed=el.checked;break;
    case "ecase":ex.caseStudy=el.checked;break;
    case "estart":buildExam();render();break;
    case "enext":ex.i++;render();break;
    case "eprev":ex.i--;render();break;
    case "ejump":ex.i=+ds.i;ex.showGrid=false;render();break;
    case "egrid":ex.showGrid=!ex.showGrid;render();break;
    case "esubmit":doSubmit();break;
    case "eagain":S.exam={stage:"setup",size:40,timed:ex.timed,caseStudy:ex.caseStudy,p:ex.p};render();break;
    case "ereview":renderReview();break;
    // drills
    case "dtab":d.tab=ds.k;d.di=0;d.dsel=null;d.drev=false;render();break;
    case "dflip":d.flip=!d.flip;render();break;
    case "dfnext":d.fi++;d.flip=false;render();break;
    case "dpick":if(!d.drev){d.dsel=ds.oid;render();}break;
    case "dcheck":d.drev=true;render();break;
    case "dnext":d.di++;d.dsel=null;d.drev=false;render();break;
  }
}
function togglePick(q,a,oid){
  if(q.type==="multi"){a.sel=a.sel.includes(oid)?a.sel.filter(x=>x!==oid):[...a.sel,oid];}
  else a.sel=[oid];
}
function renderReview(){
  const ex=S.exam;const el=document.getElementById("reviewList");
  el.innerHTML=`<hr class="hr"><h2 style="margin:8px 0 12px">Review</h2>`+
    ex.list.map((q,i)=>`<div class="card" style="margin-top:12px">${questionBlock(q,i,ex.list.length,{selected:ex.ans[q.id].sel,revealed:true,flagged:false,flagBtn:false})}</div>`).join("");
  if(el.scrollIntoView)el.scrollIntoView({behavior:"smooth"});
}

/* ---------- render ---------- */
function render(){
  renderTabs();
  if(route==="study")viewStudy();
  else if(route==="exam")viewExam();
  else if(route==="drills")viewDrills();
  else viewHome();
}

/* theme */
const themeBtn=document.getElementById("themeBtn");
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);save("theme",next);
});
const savedTheme=load("theme",null);if(savedTheme)document.documentElement.setAttribute("data-theme",savedTheme);

render();
</script>
